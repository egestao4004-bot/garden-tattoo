  <style>
/* ============================================================
   GARDEN TATTOO — Sistema de Gestão para Estúdio de Tatuagem & Piercing
   Desenvolvido por Evander
   ============================================================ */
:root{
  --bg:#0a110c; --bg2:#0f1812; --card:#142019; --card2:#1a291f; --line:#263a2c;
  --txt:#ece6d6; --muted:#9aab95; --dim:#5f7360;
  --acc:#6f9f4a; --acc2:#9cc96e; --accbg:rgba(124,170,84,.14);
  --stone:#e3d9c2; --stone2:#c9bc9c;
  --gold:#e0bf6e; --ok:#5fc48a; --okbg:rgba(95,196,138,.12);
  --warn:#e6b04a; --warnbg:rgba(230,176,74,.13); --bad:#e0624f; --badbg:rgba(224,98,79,.14);
  --info:#6fb0c9; --infobg:rgba(111,176,201,.13);
  --r:12px; --r2:8px; --sh:0 10px 30px rgba(0,0,0,.45);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Cinzel','Trajan Pro','Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 70% -10%,rgba(224,191,110,.07),transparent 45%),radial-gradient(ellipse at 0% 100%,rgba(111,159,74,.08),transparent 50%) fixed,var(--bg);color:var(--txt);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--acc2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3d2f;border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 18px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(224,191,110,.06),transparent)}
.brand img{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(227,217,194,.15),0 0 24px rgba(224,191,110,.25)}
.brand .logo{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:2.5px;line-height:1.1;color:var(--stone)}
.brand .logo b{color:var(--acc2);font-weight:700;display:block}
.brand small{display:block;color:var(--muted);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;margin-top:5px}
.nav{padding:12px 10px;flex:1}
.nav .sec{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r2);color:var(--muted);font-weight:500;transition:.15s}
.nav a:hover{background:var(--card);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(124,170,84,.2),rgba(124,170,84,.04));color:var(--stone);box-shadow:inset 3px 0 0 var(--acc2)}
.nav a.on .ic{color:var(--acc2)}
.nav .ic{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--gold);color:#1b1608;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.side-foot .user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7fae5a,#2f5a2c);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(10,17,12,.86);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.top h1{font-family:var(--disp);font-size:24px;letter-spacing:2px;font-weight:600;color:var(--stone)}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.menu-btn{display:none}
.content{padding:24px 28px 60px;flex:1}
.demo-bar{background:repeating-linear-gradient(45deg,#1f2410,#1f2410 10px,#1a1f0d 10px,#1a1f0d 20px);color:var(--gold);font-size:12px;padding:7px 28px;border-bottom:1px solid #33391a}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card2);padding:8px 14px;border-radius:var(--r2);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#3a5240;background:#213326}
.btn.pri{background:linear-gradient(180deg,#7fae55,#5a8a3a);border-color:#6f9f4a;color:#0b140c;text-shadow:0 1px 0 rgba(255,255,255,.15)}
.btn.pri:hover{background:linear-gradient(180deg,#93c267,#679a44)}
.btn.ok{background:var(--gold);border-color:var(--gold);color:#1b1608}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:6px 8px}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-family:var(--disp);font-size:12.5px;color:var(--stone2)!important;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 svg{width:16px;height:16px;flex:none}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.kpi .val{font-size:26px;font-weight:700;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi .ic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accbg);color:var(--acc2)}
.kpi .ic svg{width:19px;height:19px}
.kpi.green .ic{background:var(--okbg);color:var(--ok)}.kpi.gold .ic{background:rgba(224,191,110,.12);color:var(--gold)}.kpi.blue .ic{background:var(--infobg);color:var(--info)}
.up{color:var(--ok)}.down{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}.pill.acc{background:var(--accbg);color:var(--acc2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* Tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap;cursor:default}
.tbl th.sort{cursor:pointer}.tbl th.sort:hover{color:var(--txt)}
.tbl td{padding:11px 14px;border-bottom:1px solid #1e2e22;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#18261c}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .strong{font-weight:600}
.tbl small{color:var(--muted);display:block;font-size:12px}
.tbl tfoot td{font-weight:700;background:var(--bg2)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:8px}

/* Toolbar / filtros */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:10px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.tabs button.on{background:var(--card2);color:var(--acc2);box-shadow:0 1px 0 var(--line)}

/* Forms */
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
select option{background:var(--bg2)}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f .help{font-size:11px;color:var(--dim)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c9{grid-column:span 9}.c2{grid-column:span 2}
.fsec{grid-column:span 12;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc2);font-weight:700;padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.calc-box{background:var(--bg2);border:1px dashed #36503c;border-radius:var(--r2);padding:12px 14px;display:flex;gap:22px;flex-wrap:wrap}
.calc-box div small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.calc-box div b{font-size:17px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;animation:fade .15s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;box-shadow:var(--sh);animation:pop .18s}
.modal.lg{max-width:980px}.modal.sm{max-width:460px}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px;font-weight:700;flex:1}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--bg2);border-radius:0 0 16px 16px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}

/* Toast */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--ok);padding:11px 16px;border-radius:10px;box-shadow:var(--sh);animation:pop .2s;max-width:360px}
.toast.err{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1f3024}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}.li small{color:var(--muted);display:block;font-size:12px}
.li .r{margin-left:auto;text-align:right}
.time-chip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-weight:700;font-size:12px;min-width:54px;text-align:center}
.bar{height:7px;background:var(--bg2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}

/* Agenda */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-head h2{font-size:18px;min-width:220px}
.cal{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--card)}
.cal-grid{display:grid;grid-template-columns:56px repeat(7,minmax(130px,1fr));min-width:980px}
.cal-grid.day{grid-template-columns:56px 1fr;min-width:0}
.cal-dh{padding:10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;background:var(--bg2);position:sticky;top:0;z-index:3}
.cal-dh b{display:block;font-size:20px}.cal-dh small{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:1px}
.cal-dh.today b{color:var(--acc2)}
.cal-hours{position:relative}
.cal-h{height:56px;font-size:11px;color:var(--dim);text-align:right;padding:2px 8px 0 0;border-bottom:1px solid #1b2a1f}
.cal-col{position:relative;border-left:1px solid var(--line)}
.cal-slot{height:56px;border-bottom:1px solid #1b2a1f;cursor:pointer}
.cal-slot:hover{background:rgba(255,255,255,.025)}
.cal-col.today{background:rgba(124,170,84,.05)}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 7px;font-size:12px;overflow:hidden;cursor:pointer;border-left:3px solid;background:#1d2a20;line-height:1.25;z-index:2;transition:.12s}
.ev:hover{filter:brightness(1.2);z-index:4}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:rgba(255,255,255,.7);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.cancelado,.ev.faltou{opacity:.4;text-decoration:line-through}
.ev.concluido{opacity:.75}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--gold);z-index:5}
.now-line:before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-leg{flex:1;min-width:160px;display:flex;flex-direction:column;gap:7px;font-size:12px}
.donut-leg div{display:flex;align-items:center;gap:8px}
.donut-leg b{margin-left:auto;font-variant-numeric:tabular-nums}

/* Anamnese visual */
.ana-q{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:9px 0;border-bottom:1px solid #1f3024;align-items:center}
.ana-q .det{grid-column:span 2;color:var(--warn);font-size:12px}
.sig-img{background:#fff;border-radius:8px;max-width:340px;width:100%;border:1px solid var(--line)}
.alert{padding:11px 14px;border-radius:var(--r2);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:#ff8d8d}.alert.info{background:var(--infobg);color:#9cc0ff}.alert.ok{background:var(--okbg);color:var(--ok)}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px}

/* PDV */
.pdv{display:grid;grid-template-columns:1fr 380px;gap:16px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.12s}
.prod:hover{border-color:var(--acc);transform:translateY(-1px)}
.prod .n{font-weight:600;font-size:13px;line-height:1.3;min-height:34px}
.prod small{color:var(--muted);font-size:11px;display:block}
.prod .p{font-weight:700;color:var(--gold);margin-top:6px}
.prod.out{opacity:.4;pointer-events:none}
.cart{position:sticky;top:90px}
.cart-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #1f3024}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);cursor:pointer}
.total-line{display:flex;justify-content:space-between;padding:4px 0}
.total-line.big{font-size:20px;font-weight:800;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}

/* Login */

.login-box{width:100%;max-width:400px}
.login-box .emblem{display:block;width:150px;height:150px;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 3px rgba(227,217,194,.12),0 0 60px rgba(224,191,110,.35)}
.login-box .logo{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:5px;text-align:center;line-height:1;color:var(--stone)}
.login-box .logo b{color:var(--acc2)}
.login-box p.s{text-align:center;color:var(--stone2);margin:8px 0 24px;letter-spacing:3px;text-transform:uppercase;font-size:11px}
.login-box .card{background:rgba(20,32,25,.82);backdrop-filter:blur(10px)}

.sign{position:fixed;right:14px;bottom:10px;font-size:11px;color:var(--dim);z-index:50;pointer-events:none;letter-spacing:.5px}
.sign b{color:var(--gold);font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}.mt{margin-top:16px}.mb{margin-bottom:16px}.right{text-align:right}.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--line);margin:14px 0}

/* Fotos */
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.foto-grid.lg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.foto{position:relative;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);aspect-ratio:1;cursor:zoom-in}
.foto img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.foto:hover img{transform:scale(1.04)}
.foto .tag{position:absolute;left:6px;bottom:6px;background:rgba(10,17,12,.82);color:var(--stone);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px}
.foto .meta{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(5,9,6,.9));font-size:11px;color:var(--stone)}
.foto .del{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(10,17,12,.8);color:var(--bad);cursor:pointer;display:none}
.foto:hover .del{display:block}
.lightbox img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:10px}
.ic-in{width:13px;height:13px;vertical-align:-2px}
.proj{display:flex;flex-direction:column;gap:10px}
.proj .t{font-family:var(--disp);font-size:15px;color:var(--stone);font-weight:600}
.perm td.c{text-align:center}
/* Responsivo */
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.pdv{grid-template-columns:1fr}.cart{position:static}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-270px;width:260px;z-index:60;transition:.25s;box-shadow:var(--sh)}
  .side.open{left:0}
  .side.open~.main{pointer-events:none}
  .side-back{display:none}
  .side.open~.side-back,.app:has(.side.open)~.side-back{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  .sign{font-size:10px;bottom:4px;right:8px;opacity:.75}
  .menu-btn{display:inline-flex}
  .g2,.g3,.g-2-1{grid-template-columns:1fr}
  .content{padding:18px 14px 60px}.top{padding:12px 14px}
  .c6,.c4,.c3,.c8,.c9,.c2,.c7,.c5{grid-column:span 12}
}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

/* Impressão (ficha de anamnese, recibos) */
@media print{
  body{background:#fff;color:#000}
  .side,.top,.toolbar,.sign,.demo-bar,.modal-f,.modal-h .btn,.no-print{display:none!important}
  .modal-bg{position:static;background:none;padding:0;backdrop-filter:none}
  .modal{border:0;box-shadow:none;max-width:100%}
  .card,.modal{background:#fff;color:#000}
  .app{display:block}
  .muted,.ana-q .det{color:#444!important}
  .pill{border:1px solid #999;background:none!important;color:#000!important}
}
@media(max-width:560px){.top .sub{display:none}.top h1{font-size:22px}.top{flex-wrap:wrap}}

  </script>
</head>
<body>
  <div class="login"><div class="muted">Carregando...</div></div>
  <script>
/* ===== db.js ===== */
/* ============================================================
   CAMADA DE DADOS — Firestore (online) ou localStorage (demo)
   Cache em memória + escrita imediata + sincronização em tempo real
   Desenvolvido por Evander
   ============================================================ */
const COLS = ['clientes','profissionais','servicos','insumos','joias','movEstoque','agendamentos','atendimentos','vendas','lancamentos','anamneses','esterilizacoes','orcamentos','projetos'];
const LS_KEY = 'gardentattoo_v1';

const DEFAULT_CONFIG = {
  nome: 'Garden Tattoo',
  cnpj: '', telefone: '(11) 90000-0000', endereco: 'Rua Exemplo, 123 — Centro', instagram: '@gardentattoo',
  taxas: { 'Dinheiro':0, 'PIX':0, 'Débito':1.6, 'Crédito à vista':3.4, 'Crédito parcelado':5.9 },
  diaComissao: 5,
  horaInicio: 9, horaFim: 21,
  aliquotaSimples: 6,
  metaMensal: 45000,
  autoclaves: ['Autoclave Cristófoli Vitale 21L'],
  validadeEsterilizacao: 30,
  validadeOrcamento: 15,
  sinalPct: 30
};

const CAT_RECEITA = ['Tatuagem','Piercing','Venda de joias','Venda de produtos','Sinal/Adiantamento','Outras receitas'];
const CAT_DESPESA = ['Aluguel','Condomínio/IPTU','Energia elétrica','Água','Internet/Telefone','Salários e encargos','Comissões','Pró-labore','Limpeza e conservação','Copa/Café','Compra de insumos','Compra de joias (estoque)','Marketing/Anúncios','Contabilidade','Impostos (DAS/Simples)','Taxas de cartão','Manutenção de equipamentos','Coleta de resíduos','Software/Assinaturas','Outras despesas'];
// Categorias que NÃO entram como despesa operacional na DRE (o custo aparece pelo consumo/venda ou em outra linha)
const CAT_FORA_OPEX = ['Comissões','Taxas de cartão','Impostos (DAS/Simples)','Compra de insumos','Compra de joias (estoque)'];
const CAT_INSUMO = ['Agulhas/Cartuchos','Tintas','Descartáveis','Biossegurança','Higienização/Limpeza','Pós-procedimento','Copa/Café','Escritório'];
const CAT_JOIA = ['Labret','Argola/Segmento','Nostril','Septum/Clicker','Barbell','Banana (umbigo)','Industrial','Tragus/Hélix','Alargador/Plug','Tunnel','Outros'];
const MATERIAIS = ['Titânio ASTM F136','Aço cirúrgico 316L','Ouro 18k','Ouro 18k + zircônia','Prata 925','Silicone','Bioplast','Nióbio'];
const FORMAS = ['PIX','Dinheiro','Débito','Crédito à vista','Crédito parcelado'];
const MOTIVOS_SAIDA = ['Consumo interno','Uso em atendimento','Perda/Vencido','Ajuste de inventário'];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// datas sempre no fuso local (toISOString usaria UTC e viraria o dia às 21h no Brasil)
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => isoLocal(new Date());
const round2 = n => Math.round((+n || 0) * 100) / 100;

const DB = {
  mode: 'demo', cache: {}, config: { ...DEFAULT_CONFIG }, listeners: [], fs: null, auth: null, user: null, _unsubs: [],

  isFirebase() { const c = window.FIREBASE_CONFIG || {}; return !!(c.apiKey && c.projectId && window.firebase); },

  initFirebase() {
    if (!this.isFirebase()) return false;
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    this.fs = firebase.firestore();
    this.auth = firebase.auth();
    try { this.fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
    this.mode = 'firebase';
    return true;
  },

  /* Carrega tudo: no Firebase escuta cada coleção em tempo real */
  load() {
    COLS.forEach(c => this.cache[c] = this.cache[c] || {});
    if (this.mode === 'demo') {
      let raw = null; try { raw = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) {}
      if (!raw) { raw = Seed.build(); localStorage.setItem(LS_KEY, JSON.stringify(raw)); }
      COLS.forEach(c => this.cache[c] = raw[c] || {});
      this.config = { ...DEFAULT_CONFIG, ...(raw.config || {}) };
      // anamneses enviadas pelo formulário público (mesmo navegador) chegam por aqui
      window.addEventListener('storage', e => { if (e.key === LS_KEY) { this.load(); this.emit(); } });
      return Promise.resolve();
    }
    this._unsubs.forEach(u => u()); this._unsubs = [];
    const waits = COLS.map(c => new Promise(res => {
      let first = true;
      this._unsubs.push(this.fs.collection(c).onSnapshot(snap => {
        const o = {}; snap.forEach(d => o[d.id] = { ...d.data(), id: d.id });
        this.cache[c] = o;
        if (first) { first = false; res(); } else this.emit();
      }, err => { console.error(c, err); res(); }));
    }));
    waits.push(new Promise(res => {
      this._unsubs.push(this.fs.collection('config').doc('studio').onSnapshot(d => {
        this.config = { ...DEFAULT_CONFIG, ...(d.exists ? d.data() : {}) }; res(); this.emit();
      }, () => res()));
    }));
    return Promise.all(waits);
  },

  persistLocal() {
    if (this.mode !== 'demo') return;
    const o = { config: this.config }; COLS.forEach(c => o[c] = this.cache[c]);
    try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { UI.toast('Armazenamento local cheio', 'err'); }
  },

  all(c) { return Object.values(this.cache[c] || {}); },
  get(c, id) { return id ? (this.cache[c] || {})[id] : null; },

  save(c, obj, silent) {
    if (!obj.id) obj.id = uid();
    if (!obj.criadoEm) obj.criadoEm = new Date().toISOString();
    obj.atualizadoEm = new Date().toISOString();
    this.cache[c][obj.id] = obj;
    if (this.mode === 'firebase') {
      const clean = JSON.parse(JSON.stringify(obj));
      this.fs.collection(c).doc(obj.id).set(clean).catch(e => UI.toast('Erro ao salvar: ' + e.message, 'err'));
    } else this.persistLocal();
    if (!silent) this.emit();
    return obj;
  },

  remove(c, id, silent) {
    delete this.cache[c][id];
    if (this.mode === 'firebase') this.fs.collection(c).doc(id).delete().catch(e => UI.toast('Erro: ' + e.message, 'err'));
    else this.persistLocal();
    if (!silent) this.emit();
  },

  saveConfig(cfg) {
    this.config = { ...this.config, ...cfg };
    if (this.mode === 'firebase') {
      this.fs.collection('config').doc('studio').set(JSON.parse(JSON.stringify(this.config)));
      // dados públicos usados no cabeçalho da ficha de anamnese (sem login)
      const c = this.config; this.fs.collection('publico').doc('studio').set({ nome: c.nome || '', telefone: c.telefone || '', instagram: c.instagram || '', endereco: c.endereco || '' });
    }
    else this.persistLocal();
    this.emit();
  },

  on(fn) { this.listeners.push(fn); },
  _t: null,
  emit() { clearTimeout(this._t); this._t = setTimeout(() => this.listeners.forEach(f => f()), 30); },

  exportJSON() { const o = { config: this.config, exportadoEm: new Date().toISOString() }; COLS.forEach(c => o[c] = this.cache[c]); return o; },

  async importJSON(o) {
    COLS.forEach(c => { if (o[c]) Object.values(o[c]).forEach(r => this.save(c, r, true)); });
    if (o.config) this.saveConfig(o.config);
    this.emit();
  },

  resetDemo(empty) {
    const raw = empty ? { config: DEFAULT_CONFIG } : Seed.build();
    localStorage.setItem(LS_KEY, JSON.stringify(raw)); this.load(); this.emit();
  }
};

/* ============================================================
   REGRAS DE NEGÓCIO
   ============================================================ */
const Biz = {
  precoPorMarkup(custo, markup) { return round2(custo * (1 + (+markup || 0) / 100)); },
  margem(preco, custo) { return preco > 0 ? ((preco - custo) / preco) * 100 : 0; },
  markup(preco, custo) { return custo > 0 ? ((preco - custo) / custo) * 100 : 0; },

  custoKit(kit) {
    return round2((kit || []).reduce((s, k) => { const i = DB.get('insumos', k.insumoId); return s + (i ? i.custoUnit * k.qtd : 0); }, 0));
  },

  taxaForma(forma) { return +(DB.config.taxas || {})[forma] || 0; },

  /* Movimenta estoque e registra no histórico */
  mover({ tipo, itemId, mov, qtd, custoUnit, motivo, ref, data }) {
    const col = tipo === 'joia' ? 'joias' : 'insumos';
    const it = DB.get(col, itemId); if (!it) return;
    qtd = +qtd || 0;
    const antes = +it.qtd || 0;
    if (mov === 'entrada') {
      // custo médio ponderado
      if (custoUnit != null && custoUnit !== '' && (antes + qtd) > 0) {
        const cu = tipo === 'joia' ? it.custo : it.custoUnit;
        const novo = round2(((antes * cu) + (qtd * +custoUnit)) / (antes + qtd) * 10000) / 10000;
        if (tipo === 'joia') { it.custo = round2(novo); if (it.precoAuto !== false) it.preco = Biz.precoPorMarkup(it.custo, it.markup); }
        else it.custoUnit = novo;
      }
      it.qtd = round2(antes + qtd);
    } else if (mov === 'saida') it.qtd = round2(antes - qtd);
    else if (mov === 'ajuste') { it.qtd = round2(qtd); qtd = round2(qtd - antes); }
    DB.save(col, it, true);
    DB.save('movEstoque', {
      tipo, itemId, nome: it.nome, mov, qtd, saldo: it.qtd,
      custoUnit: custoUnit != null && custoUnit !== '' ? +custoUnit : (tipo === 'joia' ? it.custo : it.custoUnit),
      motivo: motivo || '', ref: ref || '', data: data || today(), usuario: DB.user ? DB.user.email : 'demo'
    }, true);
  },

  lancReceita({ valor, categoria, descricao, data, forma, origem, clienteId, profissionalId }) {
    if (!(valor > 0)) return;
    DB.save('lancamentos', { tipo: 'receita', categoria, descricao, valor: round2(valor), data, status: 'pago', pagoEm: data, forma, origem, clienteId, profissionalId }, true);
    const tx = Biz.taxaForma(forma);
    if (tx > 0) DB.save('lancamentos', { tipo: 'despesa', categoria: 'Taxas de cartão', descricao: `Taxa ${forma} (${tx}%) — ${descricao}`, valor: round2(valor * tx / 100), data, status: 'pago', pagoEm: data, forma, origem }, true);
  },

  vencComissao(data) {
    const d = new Date(data + 'T12:00'); d.setMonth(d.getMonth() + 1); d.setDate(DB.config.diaComissao || 5);
    return isoLocal(d);
  },

  /* Registra um atendimento (tattoo/piercing) com todas as integrações */
  registrarAtendimento(at) {
    const editing = at.id && DB.get('atendimentos', at.id);
    if (editing) Biz.estornarAtendimento(at.id, true);
    at.id = at.id || uid();
    const ref = 'atendimento:' + at.id;
    const cli = DB.get('clientes', at.clienteId); const srv = DB.get('servicos', at.servicoId); const prof = DB.get('profissionais', at.profissionalId);
    const desc = `${srv ? srv.nome : 'Atendimento'} — ${cli ? cli.nome : 'Cliente'}`;
    // insumos
    at.insumos = (at.insumos || []).filter(i => i.insumoId && +i.qtd > 0).map(i => { const ins = DB.get('insumos', i.insumoId); return { insumoId: i.insumoId, qtd: +i.qtd, custoUnit: ins ? ins.custoUnit : 0 }; });
    at.insumos.forEach(i => Biz.mover({ tipo: 'insumo', itemId: i.insumoId, mov: 'saida', qtd: i.qtd, motivo: 'Uso em atendimento', ref, data: at.data }));
    at.custoInsumos = round2(at.insumos.reduce((s, i) => s + i.qtd * i.custoUnit, 0));
    // joias aplicadas no procedimento
    at.joias = (at.joias || []).filter(j => j.joiaId && +j.qtd > 0).map(j => { const jo = DB.get('joias', j.joiaId); return { joiaId: j.joiaId, qtd: +j.qtd, preco: +j.preco || (jo ? jo.preco : 0), custo: jo ? jo.custo : 0 }; });
    at.joias.forEach(j => Biz.mover({ tipo: 'joia', itemId: j.joiaId, mov: 'saida', qtd: j.qtd, motivo: 'Aplicada em atendimento', ref, data: at.data }));
    at.totalJoias = round2(at.joias.reduce((s, j) => s + j.qtd * j.preco, 0));
    at.custoJoias = round2(at.joias.reduce((s, j) => s + j.qtd * j.custo, 0));
    at.valor = +at.valor || 0; at.desconto = +at.desconto || 0; at.sinal = +at.sinal || 0;
    at.valorLiquido = round2(at.valor - at.desconto);
    at.comissaoPct = at.comissaoPct != null && at.comissaoPct !== '' ? +at.comissaoPct : (prof ? +prof.comissaoPct || 0 : 0);
    at.comissaoValor = round2(at.valorLiquido * at.comissaoPct / 100);
    at.tipo = srv ? srv.tipo : (at.tipo || 'tattoo');
    // financeiro
    const receber = round2(at.valorLiquido - at.sinal);
    Biz.lancReceita({ valor: receber, categoria: at.tipo === 'piercing' ? 'Piercing' : 'Tatuagem', descricao: desc, data: at.data, forma: at.forma, origem: ref, clienteId: at.clienteId, profissionalId: at.profissionalId });
    Biz.lancReceita({ valor: at.totalJoias, categoria: 'Venda de joias', descricao: 'Joia aplicada — ' + desc, data: at.data, forma: at.forma, origem: ref, clienteId: at.clienteId });
    if (at.comissaoValor > 0) DB.save('lancamentos', { tipo: 'despesa', categoria: 'Comissões', descricao: `Comissão ${prof ? prof.nome : ''} (${at.comissaoPct}%) — ${desc}`, valor: at.comissaoValor, data: at.data, vencimento: Biz.vencComissao(at.data), status: 'pendente', origem: ref, profissionalId: at.profissionalId }, true);
    if (at.agendamentoId) { const ag = DB.get('agendamentos', at.agendamentoId); if (ag) { ag.status = 'concluido'; ag.atendimentoId = at.id; DB.save('agendamentos', ag, true); } }
    DB.save('atendimentos', at, true);
    DB.emit();
    return at;
  },

  estornarAtendimento(id, keep) {
    const at = DB.get('atendimentos', id); if (!at) return;
    const ref = 'atendimento:' + id;
    (at.insumos || []).forEach(i => Biz.mover({ tipo: 'insumo', itemId: i.insumoId, mov: 'entrada', qtd: i.qtd, motivo: 'Estorno de atendimento', ref }));
    (at.joias || []).forEach(j => Biz.mover({ tipo: 'joia', itemId: j.joiaId, mov: 'entrada', qtd: j.qtd, motivo: 'Estorno de atendimento', ref }));
    DB.all('lancamentos').filter(l => l.origem === ref).forEach(l => DB.remove('lancamentos', l.id, true));
    if (!keep) {
      if (at.agendamentoId) { const ag = DB.get('agendamentos', at.agendamentoId); if (ag) { ag.status = 'confirmado'; delete ag.atendimentoId; DB.save('agendamentos', ag, true); } }
      DB.remove('atendimentos', id, true);
    }
    DB.emit();
  },

  registrarVenda(v) {
    v.id = uid(); const ref = 'venda:' + v.id;
    v.itens = v.itens.map(i => { const j = DB.get('joias', i.joiaId); return { ...i, custo: j ? j.custo : 0, nome: j ? j.nome : '' }; });
    v.subtotal = round2(v.itens.reduce((s, i) => s + i.qtd * i.preco, 0));
    v.total = round2(v.subtotal - (+v.desconto || 0));
    v.custoTotal = round2(v.itens.reduce((s, i) => s + i.qtd * i.custo, 0));
    v.itens.forEach(i => Biz.mover({ tipo: 'joia', itemId: i.joiaId, mov: 'saida', qtd: i.qtd, motivo: 'Venda (PDV)', ref, data: v.data }));
    const cli = DB.get('clientes', v.clienteId);
    Biz.lancReceita({ valor: v.total, categoria: 'Venda de joias', descricao: `Venda PDV #${v.id.slice(-5).toUpperCase()}${cli ? ' — ' + cli.nome : ''}`, data: v.data, forma: v.forma, origem: ref, clienteId: v.clienteId });
    DB.save('vendas', v, true); DB.emit();
    return v;
  },

  estornarVenda(id) {
    const v = DB.get('vendas', id); if (!v) return; const ref = 'venda:' + id;
    v.itens.forEach(i => Biz.mover({ tipo: 'joia', itemId: i.joiaId, mov: 'entrada', qtd: i.qtd, motivo: 'Estorno de venda', ref }));
    DB.all('lancamentos').filter(l => l.origem === ref).forEach(l => DB.remove('lancamentos', l.id, true));
    DB.remove('vendas', id, true); DB.emit();
  },

  /* Gera as despesas recorrentes do mês (aluguel, salários, etc.) */
  gerarRecorrentes(ym) {
    const base = DB.all('lancamentos').filter(l => l.recorrente);
    const modelos = {}; base.forEach(l => { const k = l.recorrenteId || l.id; if (!modelos[k] || modelos[k].data < l.data) modelos[k] = l; });
    let n = 0;
    Object.entries(modelos).forEach(([k, m]) => {
      if (DB.all('lancamentos').some(l => (l.recorrenteId === k || l.id === k) && l.data.slice(0, 7) === ym)) return;
      const dia = m.data.slice(8, 10);
      const [y, mo] = ym.split('-').map(Number); const last = new Date(y, mo, 0).getDate();
      const data = `${ym}-${String(Math.min(+dia, last)).padStart(2, '0')}`;
      DB.save('lancamentos', { tipo: m.tipo, categoria: m.categoria, descricao: m.descricao, valor: m.valor, data, vencimento: data, status: 'pendente', recorrente: true, recorrenteId: k, profissionalId: m.profissionalId }, true);
      n++;
    });
    DB.emit(); return n;
  },

  /* DRE gerencial do período (ym = 'AAAA-MM' ou ano 'AAAA') */
  dre(prefix) {
    const inP = d => (d || '').startsWith(prefix);
    const L = DB.all('lancamentos').filter(l => inP(l.data));
    const rec = {}; L.filter(l => l.tipo === 'receita').forEach(l => rec[l.categoria] = (rec[l.categoria] || 0) + l.valor);
    const receita = Object.values(rec).reduce((a, b) => a + b, 0);
    const sumCat = c => L.filter(l => l.tipo === 'despesa' && l.categoria === c).reduce((s, l) => s + l.valor, 0);
    const taxas = sumCat('Taxas de cartão'), impostos = sumCat('Impostos (DAS/Simples)'), comissoes = sumCat('Comissões');
    const ats = DB.all('atendimentos').filter(a => inP(a.data));
    const vds = DB.all('vendas').filter(v => inP(v.data));
    const insumosAt = ats.reduce((s, a) => s + (a.custoInsumos || 0), 0);
    const cmvJoias = ats.reduce((s, a) => s + (a.custoJoias || 0), 0) + vds.reduce((s, v) => s + (v.custoTotal || 0), 0);
    const consumoInterno = DB.all('movEstoque').filter(m => inP(m.data) && m.mov === 'saida' && ['Consumo interno', 'Perda/Vencido'].includes(m.motivo)).reduce((s, m) => s + m.qtd * (m.custoUnit || 0), 0);
    const opex = {}; L.filter(l => l.tipo === 'despesa' && !CAT_FORA_OPEX.includes(l.categoria)).forEach(l => opex[l.categoria] = (opex[l.categoria] || 0) + l.valor);
    if (consumoInterno > 0) opex['Consumo interno de insumos (café, limpeza...)'] = consumoInterno;
    const totalOpex = Object.values(opex).reduce((a, b) => a + b, 0);
    const receitaLiq = receita - taxas - impostos;
    const custosVar = insumosAt + cmvJoias + comissoes;
    const margemContrib = receitaLiq - custosVar;
    const lucro = margemContrib - totalOpex;
    return { rec, receita, taxas, impostos, receitaLiq, insumosAt, cmvJoias, comissoes, custosVar, margemContrib, opex, totalOpex, lucro, margemPct: receita ? lucro / receita * 100 : 0, nAt: ats.length, nVd: vds.length };
  },

  caixa(prefix) {
    const L = DB.all('lancamentos').filter(l => l.status === 'pago' && (l.pagoEm || l.data || '').startsWith(prefix));
    const ent = L.filter(l => l.tipo === 'receita').reduce((s, l) => s + l.valor, 0);
    const sai = L.filter(l => l.tipo === 'despesa').reduce((s, l) => s + l.valor, 0);
    return { ent, sai, saldo: ent - sai };
  },

  anamneseAlertas(a) {
    const r = a.respostas || {}; const out = [];
    ANAMNESE_PERGUNTAS.forEach(q => { if (r[q.id] === 'sim' && q.alerta) out.push(q.curto || q.txt); });
    return out;
  }
};

/* Perguntas da ficha (usadas no formulário público e na visualização) */
const ANAMNESE_PERGUNTAS = [
  { id: 'tratamento', txt: 'Está em tratamento médico atualmente?', det: true, alerta: true, curto: 'Em tratamento médico' },
  { id: 'medicamentos', txt: 'Faz uso contínuo de algum medicamento?', det: true, alerta: true, curto: 'Medicamento contínuo' },
  { id: 'anticoagulante', txt: 'Usa anticoagulante ou AAS (aspirina) nos últimos 7 dias?', alerta: true, curto: 'Anticoagulante/AAS' },
  { id: 'roacutan', txt: 'Usou isotretinoína (Roacutan) nos últimos 6 meses?', alerta: true, curto: 'Isotretinoína recente' },
  { id: 'diabetes', txt: 'Tem diabetes?', alerta: true, curto: 'Diabetes' },
  { id: 'hemofilia', txt: 'Tem hemofilia ou outro distúrbio de coagulação?', alerta: true, curto: 'Distúrbio de coagulação' },
  { id: 'cardiaco', txt: 'Tem problemas cardíacos ou usa marca-passo?', alerta: true, curto: 'Problema cardíaco' },
  { id: 'pressao', txt: 'Tem pressão alta ou baixa?', det: true, alerta: true, curto: 'Pressão alterada' },
  { id: 'epilepsia', txt: 'Tem epilepsia, convulsões ou histórico de desmaios?', alerta: true, curto: 'Epilepsia/desmaios' },
  { id: 'hepatite', txt: 'Tem ou já teve hepatite?', det: true, alerta: true, curto: 'Hepatite' },

    const m = { agendado: ['info', 'Agendado'], confirmado: ['ok', 'Confirmado'], concluido: ['', 'Concluído'], cancelado: ['bad', 'Cancelado'], faltou: ['warn', 'Faltou'],
      pago: ['ok', 'Pago'], pendente: ['warn', 'Pendente'], atrasado: ['bad', 'Atrasado'], nova: ['acc', 'Nova'], revisada: ['ok', 'Revisada'], arquivada: ['', 'Arquivada'],
      andamento: ['info', 'Em andamento'], rascunho: ['', 'Rascunho'], enviado: ['info', 'Enviado'], aprovado: ['ok', 'Aprovado'], recusado: ['bad', 'Recusado'], expirado: ['', 'Expirado'],
      liberado: ['ok', 'Liberado'], reprovado: ['bad', 'Reprovado'], vencido: ['warn', 'Vencido'] };
    const [c, t] = m[s] || ['', s || '—']; return `<span class="pill ${c}">${t}</span>`;
  },

  wa(tel, msg) { const n = (tel || '').replace(/\D/g, ''); return `https://wa.me/${n.length <= 11 ? '55' + n : n}?text=${encodeURIComponent(msg || '')}`; },

  copy(txt) { navigator.clipboard?.writeText(txt).then(() => UI.toast('Copiado!')).catch(() => prompt('Copie:', txt)); },

  download(name, content, type = 'application/json') {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  csv(rows) { return '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n'); },

  /* Tabela com ordenação */
  table(cols, rows, { id = 'tbl', foot = '', emptyMsg = 'Nenhum registro encontrado' } = {}) {
    if (!rows.length) return `<div class="tbl-wrap">${UI.empty(emptyMsg)}</div>`;
    return `<div class="tbl-wrap"><table class="tbl" id="${id}"><thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.t}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr ${r._attr || ''}>${cols.map(c => `<td class="${c.cls || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div>`;
  },

  /* ---------- Gráficos SVG ---------- */
  barChart(labels, series, { h = 220, colors = ['#7fae55', '#3b5243', '#e0bf6e'], fmt = brl } = {}) {
    const W = 640, H = h, pl = 54, pb = 26, pt = 12, pr = 8;
    const dmax = Math.max(0, ...series.flatMap(s => s.data)); const max = dmax > 0 ? dmax * 1.1 : 100;
    const n = labels.length, gw = (W - pl - pr) / n, bw = Math.min(26, (gw - 10) / series.length);
    const y = v => pt + (H - pt - pb) * (1 - v / max);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="#22342a"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${v >= 1000 ? num(v / 1000, 1) + 'k' : num(v, 0)}</text>`; }
    labels.forEach((l, i) => {
      const x0 = pl + gw * i + (gw - bw * series.length) / 2;
      series.forEach((s, j) => { const v = s.data[i] || 0, yy = y(Math.max(0, v)); g += `<rect x="${x0 + j * bw}" y="${yy}" width="${bw - 3}" height="${Math.max(0, H - pb - yy)}" rx="3" fill="${s.color || colors[j]}"><title>${s.name}: ${fmt(v)}</title></rect>`; });
      g += `<text x="${pl + gw * i + gw / 2}" y="${H - 8}" text-anchor="middle">${l}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend mt">${series.map((s, j) => `<span><i class="dot" style="background:${s.color || colors[j]}"></i>${s.name}</span>`).join('')}</div>`;
  },

  lineChart(labels, data, { h = 200, color = '#9cc96e', fmt = brl } = {}) {
    const W = 640, H = h, pl = 54, pb = 26, pt = 12, pr = 12;
    const mn = Math.min(0, ...data), dmx = Math.max(0, ...data), mx = dmx > 0 ? dmx * 1.1 : (mn < 0 ? 0 : 100);
    const x = i => pl + (W - pl - pr) * (labels.length > 1 ? i / (labels.length - 1) : .5), y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
    let g = ''; for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#22342a"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${Math.abs(v) >= 1000 ? num(v / 1000, 1) + 'k' : num(v, 0)}</text>`; }
    if (mn < 0) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="#555" stroke-dasharray="4"/>`;
    const pts = data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    g += `<polygon points="${x(0)},${y(Math.max(mn, 0))} ${pts} ${x(data.length - 1)},${y(Math.max(mn, 0))}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    data.forEach((v, i) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${v < 0 ? '#e0624f' : color}"><title>${labels[i]}: ${fmt(v)}</title></circle><text x="${x(i)}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  },

  donut(items, { size = 170, fmt = brl } = {}) {
    const pal = ['#7fae55', '#e0bf6e', '#5fb3a1', '#c98a5a', '#a7c4a0', '#d9cfb5', '#3f8f6b', '#b5a26a', '#6fb0c9', '#8a9a5b', '#e6d38a', '#9e7b5a'];
    const tot = items.reduce((s, i) => s + i.v, 0) || 1; let a = -Math.PI / 2; const r = 70, R = 85, c = size / 2;
    let p = '';
    items.forEach((it, i) => {
      const ang = it.v / tot * Math.PI * 2; if (ang <= 0) return;
      const a2 = a + Math.min(ang, Math.PI * 2 - 0.0001), large = ang > Math.PI ? 1 : 0;
      const P = (rad, an) => `${c + rad * Math.cos(an)},${c + rad * Math.sin(an)}`;
      p += `<path d="M${P(R, a)} A${R},${R} 0 ${large} 1 ${P(R, a2)} L${P(r, a2)} A${r},${r} 0 ${large} 0 ${P(r, a)} Z" fill="${pal[i % pal.length]}"><title>${it.k}: ${fmt(it.v)}</title></path>`;
      a = a2;
    });
    return `<div class="donut-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${p}<text x="${c}" y="${c - 2}" text-anchor="middle" fill="#ece6d6" font-size="15" font-weight="700">${fmt(tot)}</text><text x="${c}" y="${c + 15}" text-anchor="middle" fill="#9aab95" font-size="10">TOTAL</text></svg>
      <div class="donut-leg">${items.map((it, i) => `<div><i class="dot" style="background:${pal[i % pal.length]}"></i>${esc(it.k)}<b>${fmt(it.v)}</b></div>`).join('')}</div></div>`;
  }
};

  noAccess(u) {
    document.body.innerHTML = `<div class="login"><div class="login-box card"><h2 style="margin-bottom:10px">Acesso não liberado</h2>

      <div class="row mt"><button class="btn" onclick="UI.copy('${u.uid}')">${ic('copy')} Copiar UID</button><span class="grow"></span><button class="btn" onclick="DB.auth.signOut()">Sair</button></div></div></div>`;
  },

  /* No modo demo dá para "ver como" cada perfil, para apresentar as permissões */
  demoUser() {
    const r = sessionStorage.getItem('gt_role') || 'admin';
    if (r.startsWith('artista:')) { const p = DB.get('profissionais', r.slice(8)); if (p) { DB.user = { email: 'demo@studio', nome: p.nome, papel: 'artista', profissionalId: p.id }; return; } }
    if (r === 'recepcao') { const p = DB.all('profissionais').find(x => /recep/i.test(x.funcao)); DB.user = { email: 'demo@studio', nome: p ? p.nome : 'Recepção', papel: 'recepcao' }; return; }
    DB.user = { email: 'demo@studio', nome: 'Administrador (demo)', papel: 'admin' };
  },

  go() {

    const [r, q] = h.split('?');
    this.route = Views[r] && Perm.can(r) ? r : 'dashboard';
    this.params = Object.fromEntries(new URLSearchParams(q || ''));
    $('#side').classList.remove('open');
    this.render(true);
  },

  render(scrollTop) {
    const v = Views[this.route];
    this.brand(); this.nav();

    if (scrollTop) window.scrollTo(0, 0);
  },

  /* Re-render após mudanças de dados, preservando foco/scroll e sem atrapalhar digitação */
  renderSoft() {
    if (!$('#view')) return;
    const a = document.activeElement;
    if (a && $('#view').contains(a) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) { this.nav(); return; }
    const y = window.scrollY; this.render(false); window.scrollTo(0, y);
  },

  actions(html) { $('#topAct').innerHTML = html; }
};

document.addEventListener('DOMContentLoaded', () => App.start());

Views.dashboard = {
  title: 'Painel', sub: () => new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }),
  render(el) {
    if (Perm.isArtista()) return this.renderArtista(el);
    const adm = Perm.isAdmin();
    const ym = ymNow(), prev = ymShift(ym, -1);
    const d = Biz.dre(ym), dp = Biz.dre(prev);
    const dia = today().slice(8), recAte = DB.all('lancamentos').filter(l => l.tipo === 'receita' && l.data.startsWith(prev) && l.data.slice(8) <= dia).reduce((s, l) => s + l.valor, 0);
    const var_ = recAte ? (d.receita - recAte) / recAte * 100 : 0;
    const ats = DB.all('atendimentos').filter(a => a.data.startsWith(ym));
    const tick = ats.length ? sum(ats, a => a.valorLiquido + (a.totalJoias || 0)) / ats.length : 0;
    const hoje = DB.all('agendamentos').filter(a => a.data === today() && !['cancelado'].includes(a.status)).sort((a, b) => a.hora.localeCompare(b.hora));
    const pend = DB.all('lancamentos').filter(l => l.status === 'pendente');
    const aPagar = sum(pend.filter(l => l.tipo === 'despesa'), l => l.valor);
    const lim = new Date(); lim.setDate(lim.getDate() + 7); const limS = isoLocal(lim);
    const vencendo = pend.filter(l => l.tipo === 'despesa' && (l.vencimento || l.data) <= limS).sort((a, b) => (a.vencimento || a.data).localeCompare(b.vencimento || b.data));
    const baixoI = DB.all('insumos').filter(i => i.qtd <= i.minimo), baixoJ = DB.all('joias').filter(j => j.qtd <= j.minimo);
    const novas = DB.all('anamneses').filter(a => a.status === 'nova');
    const mes = new Date().getMonth() + 1;
    const niver = DB.all('clientes').filter(c => c.nasc && +c.nasc.slice(5, 7) === mes).sort((a, b) => a.nasc.slice(8).localeCompare(b.nasc.slice(8)));
    const meta = +DB.config.metaMensal || 0, metaP = meta ? Math.min(100, d.receita / meta * 100) : 0;

    const meses = [...Array(6)].map((_, i) => ymShift(ym, i - 5));
    const dres = meses.map(m => Biz.dre(m));
    const labels = meses.map(m => MESES[+m.slice(5) - 1]);

    const rank = DB.all('profissionais').filter(p => p.comissaoPct > 0).map(p => { const a = ats.filter(x => x.profissionalId === p.id); return { p, n: a.length, v: sum(a, x => x.valorLiquido), c: sum(a, x => x.comissaoValor) }; }).sort((a, b) => b.v - a.v);
    const maxR = Math.max(1, ...rank.map(r => r.v));

      ['Registrar o primeiro ciclo da autoclave', '#/biosseguranca', DB.all('esterilizacoes').length > 0]
    ];
    const faltam = passos.filter(p => !p[2]).length;
    el.innerHTML = `
      ${adm && faltam ? `<div class="card mb" style="background:linear-gradient(120deg,rgba(124,170,84,.14),rgba(224,191,110,.05))"><h3>🌿 Primeiros passos <span class="sp"></span><span style="text-transform:none" class="muted">${passos.length - faltam} de ${passos.length} concluídos</span></h3>
        <div class="grid g2" style="gap:6px 24px">${passos.map(([t, h, d]) => `<a class="li" href="${h}" style="color:${d ? 'var(--muted)' : 'var(--txt)'}"><span class="pill ${d ? 'ok' : ''}">${d ? '✓' : '•'}</span><div class="t" style="${d ? 'text-decoration:line-through;font-weight:400' : ''}">${t}</div></a>`).join('')}</div></div>` : ''}

        ${adm ? `<div class="card"><h3>Resumo DRE — ${ymLabel(ym)}</h3>

/* ---------------- AGENDA ---------------- */
Views.agenda = {
  title: 'Agenda', st: { base: today(), modo: window.innerWidth < 700 ? 'dia' : 'semana', prof: '' },
  sub() { return 'Clique num horário vazio para agendar ou num card para ver detalhes'; },
  render(el) {
    const st = this.st, cfg = DB.config, H0 = +cfg.horaInicio || 9, H1 = +cfg.horaFim || 21, PX = 56;
    const b = new Date(st.base + 'T12:00');
    let dias = [];
    if (st.modo === 'dia') dias = [new Date(b)];
    else { const seg = new Date(b); seg.setDate(b.getDate() - ((b.getDay() + 6) % 7)); dias = [...Array(7)].map((_, i) => { const d = new Date(seg); d.setDate(seg.getDate() + i); return d; }); }
    const isoD = d => isoLocal(d);
    const profs = DB.all('profissionais').filter(p => p.ativo !== false && ['Tatuador', 'Tatuadora', 'Body Piercer', 'Tatuador(a) e Piercer'].includes(p.funcao) || (p.comissaoPct > 0 && p.ativo !== false));
    if (Perm.isArtista()) st.prof = Perm.profId();
    const ags = DB.all('agendamentos').filter(a => dias.some(d => isoD(d) === a.data) && (!st.prof || a.profissionalId === st.prof));
    const titulo = st.modo === 'dia' ? b.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }) : `${dias[0].toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })} — ${dias[6].toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })}`;
    const horas = []; for (let h = H0; h < H1; h++) horas.push(h);
    const now = new Date(), nowMin = (now.getHours() - H0) * 60 + now.getMinutes();
    const tot = sum(ags.filter(a => !['cancelado', 'faltou'].includes(a.status)), a => a.valorPrevisto);

    App.actions(`<button class="btn" id="agLink">${ic('link')} Link da ficha</button><button class="btn pri" id="agNovo">${ic('plus')} Agendar</button>`);
    el.innerHTML = `
      <div class="cal-head">
        <button class="btn icon" id="prev">${ic('left')}</button><button class="btn sm" id="hoje">Hoje</button><button class="btn icon" id="next">${ic('right')}</button>
        <h2 style="text-transform:capitalize">${titulo}</h2>
        <div class="tabs"><button data-m="dia" class="${st.modo === 'dia' ? 'on' : ''}">Dia</button><button data-m="semana" class="${st.modo === 'semana' ? 'on' : ''}">Semana</button></div>
        <input type="date" id="goDate" value="${st.base}" style="width:auto">
        <select id="fProf" style="width:auto" ${Perm.isArtista() ? 'disabled' : ''}><option value="">Todos os profissionais</option>${profs.map(p => `<option value="${p.id}" ${st.prof === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>
        <span class="grow"></span><span class="muted small">${ags.length} agendamentos · previsto ${brl(tot)}</span>
      </div>
      <div class="legend mb">${profs.map(p => `<span><i class="dot" style="background:${p.cor}"></i>${esc(p.nome)}</span>`).join('')}</div>
      <div class="cal"><div class="cal-grid ${st.modo === 'dia' ? 'day' : ''}">
        <div class="cal-dh" style="border-left:0"></div>
        ${dias.map(d => `<div class="cal-dh ${isoD(d) === today() ? 'today' : ''}"><small>${d.toLocaleDateString('pt-BR', { weekday: 'short' })}</small><b>${d.getDate()}</b></div>`).join('')}
        <div class="cal-hours">${horas.map(h => `<div class="cal-h">${String(h).padStart(2, '0')}:00</div>`).join('')}</div>
        ${dias.map(d => {
          const ds = isoD(d); const evs = ags.filter(a => a.data === ds).sort((a, b) => a.hora.localeCompare(b.hora));
          // colunas para sobreposição
          // agrupa eventos que se sobrepõem e distribui em colunas só dentro do grupo
          let grp = [], gEnd = -1, lanes = [];
          const close = () => { grp.forEach(e => e._n = lanes.length); grp = []; lanes = []; };
          evs.forEach(e => { const [hh, mm] = e.hora.split(':').map(Number); e._s = (hh - H0) * 60 + mm; e._e = e._s + (+e.duracaoMin || 60);
            if (e._s >= gEnd) close();
            let l = lanes.findIndex(x => x <= e._s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = e._e; e._l = l; grp.push(e); gEnd = Math.max(gEnd, e._e); });
          close();
          return `<div class="cal-col ${ds === today() ? 'today' : ''}" data-d="${ds}">${horas.map(h => `<div class="cal-slot" data-h="${h}"></div>`).join('')}
            ${evs.map(e => { const p = DB.get('profissionais', e.profissionalId), c = DB.get('clientes', e.clienteId), s = DB.get('servicos', e.servicoId); const w = 100 / (e._n || 1);
              return `<div class="ev ${e.status}" data-id="${e.id}" style="top:${e._s / 60 * PX}px;height:${Math.max(26, (e._e - e._s) / 60 * PX - 3)}px;left:calc(${e._l * w}% + 3px);right:auto;width:calc(${w}% - 6px);border-color:${p?.cor || '#888'};background:${(p?.cor || '#888')}22"><b>${e.hora} ${esc(c?.nome || '—')}</b><span>${esc(s?.nome || '')}</span><span>${esc(p?.nome || '')}${e.sinalPago ? ' · sinal ✓' : ''}</span></div>`; }).join('')}
            ${ds === today() && nowMin > 0 && nowMin < (H1 - H0) * 60 ? `<div class="now-line" style="top:${nowMin / 60 * PX}px"></div>` : ''}
          </div>`;
        }).join('')}
      </div></div>`;
    const shift = n => { const d = new Date(st.base + 'T12:00'); d.setDate(d.getDate() + n * (st.modo === 'dia' ? 1 : 7)); st.base = isoD(d); this.render(el); };
    $('#prev').onclick = () => shift(-1); $('#next').onclick = () => shift(1);
    $('#hoje').onclick = () => { st.base = today(); this.render(el); };
    $('#goDate').onchange = e => { st.base = e.target.value || today(); this.render(el); };
    $('#fProf').onchange = e => { st.prof = e.target.value; this.render(el); };
    $$('[data-m]', el).forEach(x => x.onclick = () => { st.modo = x.dataset.m; this.render(el); });
    $$('.cal-slot', el).forEach(s => s.onclick = () => Forms.agendamento({ data: s.parentElement.dataset.d, hora: String(s.dataset.h).padStart(2, '0') + ':00', profissionalId: st.prof }));
    $$('.ev', el).forEach(e => e.onclick = ev => { ev.stopPropagation(); Forms.verAgendamento(e.dataset.id); });
    $('#agNovo').onclick = () => Forms.agendamento({ data: st.base });
    $('#agLink').onclick = () => Forms.linkAnamnese();
  }
};

Views.atendimentos = {
  title: 'Atendimentos', st: { ym: ymNow(), tipo: '', prof: '', q: '' },
  sub() { return 'Cada atendimento baixa os insumos do estoque, lança a receita, as taxas e a comissão'; },
  render(el) {
    const st = this.st;
    App.actions(`<button class="btn" id="atCsv">${ic('download')} CSV</button><button class="btn pri" id="atNovo">${ic('plus')} Novo atendimento</button>`);
    el.innerHTML = `<div class="toolbar">
      <button class="btn icon" id="mPrev">${ic('left')}</button><b style="min-width:130px;text-align:center">${ymLabel(st.ym)}</b><button class="btn icon" id="mNext">${ic('right')}</button>
      <div class="tabs">${[['', 'Todos'], ['tattoo', 'Tatuagem'], ['piercing', 'Piercing']].map(([k, t]) => `<button data-t="${k}" class="${st.tipo === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <select id="fP" style="width:auto" ${Perm.isArtista() ? 'disabled' : ''}><option value="">Todos os profissionais</option>${DB.all('profissionais').filter(p => p.comissaoPct > 0).map(p => `<option value="${p.id}" ${st.prof === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>
      <div class="search">${ic('search')}<input id="q" placeholder="Buscar cliente, descrição..." value="${esc(st.q)}"></div></div>
      <div id="kp"></div><div id="lst" class="mt"></div>`;
    const draw = () => {
      const q = st.q.toLowerCase();
      if (Perm.isArtista()) st.prof = Perm.profId();
      const rows = DB.all('atendimentos').filter(a => a.data.startsWith(st.ym) && (!st.tipo || a.tipo === st.tipo) && (!st.prof || a.profissionalId === st.prof))
        .map(a => ({ ...a, _c: DB.get('clientes', a.clienteId), _p: DB.get('profissionais', a.profissionalId), _s: DB.get('servicos', a.servicoId) }))
        .filter(a => !q || [a._c?.nome, a.descricao, a._s?.nome].join(' ').toLowerCase().includes(q))
        .sort((a, b) => (b.data + (b.hora || '')).localeCompare(a.data + (a.hora || '')));
      rows.forEach(a => { a._tx = (a.valorLiquido - (a.sinal || 0) + (a.totalJoias || 0)) * Biz.taxaForma(a.forma) / 100; a._lucro = a.valorLiquido + (a.totalJoias || 0) - a.custoInsumos - (a.custoJoias || 0) - a.comissaoValor - a._tx; });
      const T = k => sum(rows, r => r[k]);
      $('#kp', el).innerHTML = `<div class="grid g4">
        <div class="card kpi"><div class="lbl">Faturado (serviços + joias)</div><div class="val">${brl(T('valorLiquido') + T('totalJoias'))}</div><div class="hint">${rows.length} atendimentos</div></div>
        <div class="card kpi gold"><div class="lbl">Custo de insumos</div><div class="val">${brl(T('custoInsumos'))}</div><div class="hint">média ${brl(rows.length ? T('custoInsumos') / rows.length : 0)} por atendimento</div></div>
        <div class="card kpi blue"><div class="lbl">Comissões</div><div class="val">${brl(T('comissaoValor'))}</div></div>
        ${Perm.isAdmin() ? `<div class="card kpi green"><div class="lbl">Lucro bruto dos atendimentos</div><div class="val">${brl(T('_lucro'))}</div><div class="hint">margem ${pct((T('valorLiquido') + T('totalJoias')) ? T('_lucro') / (T('valorLiquido') + T('totalJoias')) * 100 : 0)}</div></div>` : `<div class="card kpi green"><div class="lbl">Ticket médio</div><div class="val">${brl(rows.length ? (T('valorLiquido') + T('totalJoias')) / rows.length : 0)}</div></div>`}</div>`;
      $('#lst', el).innerHTML = UI.table([
        { t: 'Data', v: a => `<b>${fdate(a.data)}</b><small>${a.hora || ''}</small>` },
        { t: 'Cliente', v: a => `<span class="strong">${esc(a._c?.nome || '—')}</span><small>${esc(a.regiao || '')}</small>` },
        { t: 'Serviço', v: a => `${a.tipo === 'piercing' ? '<span class="pill info">Piercing</span>' : '<span class="pill acc">Tattoo</span>'} ${esc(a._s?.nome || '')}<small>${esc(a.descricao || '')}</small>` },
        { t: 'Profissional', v: a => `<span style="color:${a._p?.cor}">●</span> ${esc(a._p?.nome || '—')}` },
        { t: 'Valor', cls: 'num', v: a => `${brl(a.valorLiquido + (a.totalJoias || 0))}<small>${esc(a.forma || '')}</small>` },
        { t: 'Insumos', cls: 'num', v: a => brl(a.custoInsumos) },
        { t: 'Comissão', cls: 'num', v: a => `${brl(a.comissaoValor)}<small>${a.comissaoPct}%</small>` },
        ...(Perm.isAdmin() ? [{ t: 'Lucro', cls: 'num', v: a => `<b class="${a._lucro < 0 ? 'down' : 'up'}">${brl(a._lucro)}</b>` }] : []),
        { t: '', cls: 'act', v: a => `<button class="btn sm icon" data-v="${a.id}" title="Ver">${ic('eye')}</button>${Perm.gestao() ? `<button class="btn sm icon" data-e="${a.id}" title="Editar">${ic('edit')}</button><button class="btn sm icon danger" data-x="${a.id}" title="Excluir">${ic('trash')}</button>` : ''}` }
      ], rows, { emptyMsg: 'Nenhum atendimento neste período' });
      $$('[data-e]', el).forEach(b => b.onclick = () => Forms.atendimento(DB.get('atendimentos', b.dataset.e)));
      $$('[data-v]', el).forEach(b => b.onclick = () => Forms.verAtendimento(b.dataset.v));
      $$('[data-x]', el).forEach(b => b.onclick = () => UI.confirm('Excluir este atendimento? Os insumos e joias voltam ao estoque e os lançamentos financeiros vinculados são removidos.', () => { Biz.estornarAtendimento(b.dataset.x); UI.toast('Atendimento excluído e estornado'); }, { yes: 'Excluir e estornar' }));
      this._rows = rows;
    };
    draw();
    $('#q').oninput = e => { st.q = e.target.value; draw(); };
    $('#fP').onchange = e => { st.prof = e.target.value; draw(); };
    $$('[data-t]', el).forEach(b => b.onclick = () => { st.tipo = b.dataset.t; this.render(el); });
    $('#mPrev').onclick = () => { st.ym = ymShift(st.ym, -1); this.render(el); };
    $('#mNext').onclick = () => { st.ym = ymShift(st.ym, 1); this.render(el); };
    $('#atNovo').onclick = () => Forms.atendimento({});
    $('#atCsv').onclick = () => UI.download(`atendimentos-${st.ym}.csv`, UI.csv([['Data', 'Hora', 'Cliente', 'Tipo', 'Serviço', 'Descrição', 'Profissional', 'Valor líquido', 'Joias', 'Forma', 'Custo insumos', 'Comissão', 'Lucro'], ...this._rows.map(a => [fdate(a.data), a.hora, a._c?.nome, a.tipo, a._s?.nome, a.descricao, a._p?.nome, num(a.valorLiquido), num(a.totalJoias || 0), a.forma, num(a.custoInsumos), num(a.comissaoValor), num(a._lucro)])]), 'text/csv');
  }
};

      <div class="f"><label>Link da ficha</label><input readonly value="${esc(url)}" id="lkU"></div>

      onOpen: m => m.$('#lkC').onclick = () => UI.copy(url) });

  agendamento(a = {}) {
    const edit = !!a.id; a = { status: 'agendado', duracaoMin: 60, ...a };
    const profs = UI.opts('profissionais', { filter: p => p.comissaoPct > 0 && p.ativo !== false });
    UI.modal({ title: edit ? 'Editar agendamento' : 'Novo agendamento', body: `<form class="fg" id="agF">
      <div class="f c12"><label>Cliente *</label><div class="row"><select name="clienteId" class="grow" style="flex:1">${UI.opts('clientes').map(([v, t]) => `<option value="${v}" ${v === a.clienteId ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select><button type="button" class="btn" id="agCli">${ic('plus')} Novo</button></div></div>
      ${UI.f('Profissional *', 'profissionalId', a.profissionalId, { type: 'select', opts: profs })}
      ${UI.f('Serviço *', 'servicoId', a.servicoId, { type: 'select', opts: UI.opts('servicos', { filter: s => s.ativo !== false }) })}
      ${UI.f('Data *', 'data', a.data || today(), { type: 'date', col: 4 })}${UI.f('Hora *', 'hora', a.hora || '10:00', { type: 'time', col: 4 })}${UI.f('Duração (min)', 'duracaoMin', a.duracaoMin, { type: 'number', col: 4 })}
      ${UI.f('Valor previsto (R$)', 'valorPrevisto', a.valorPrevisto, { type: 'number', col: 4 })}${UI.f('Sinal (R$)', 'sinal', a.sinal, { type: 'number', col: 4 })}
      ${UI.f('Forma do sinal', 'formaSinal', a.formaSinal || 'PIX', { type: 'select', col: 4, opts: FORMAS })}
      <div class="f c6"><label>&nbsp;</label><label class="row" style="font-size:13px;color:var(--txt)"><input type="checkbox" name="sinalPago" ${a.sinalPago ? 'checked' : ''}> Sinal já foi pago (lança no caixa)</label></div>
      <div class="f c6"><label>Projeto (várias sessões)</label><select name="projetoId" id="agProj"></select></div>
      ${UI.f('Status', 'status', a.status, { type: 'select', opts: [['agendado', 'Agendado'], ['confirmado', 'Confirmado'], ['concluido', 'Concluído'], ['cancelado', 'Cancelado'], ['faltou', 'Faltou']] })}
      ${UI.f('Observações / referência da arte', 'obs', a.obs, { type: 'textarea', col: 12 })}
      <div class="c12" id="agConf"></div></form>`,
      foot: `${edit ? `<button class="btn danger" id="agDel">${ic('trash')} Excluir</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn pri" id="agOk">Salvar</button>`,
      onOpen: m => {
        const F = m.$('#agF');
        const checkConf = () => {
          const d = UI.formData(F); const [hh, mm] = (d.hora || '0:0').split(':').map(Number); const s = hh * 60 + mm, e = s + (+d.duracaoMin || 60);
          const conf = DB.all('agendamentos').filter(x => x.id !== a.id && x.data === d.data && x.profissionalId === d.profissionalId && !['cancelado', 'faltou'].includes(x.status)).filter(x => { const [h2, m2] = x.hora.split(':').map(Number); const s2 = h2 * 60 + m2, e2 = s2 + (+x.duracaoMin || 60); return s < e2 && s2 < e; });
          m.$('#agConf').innerHTML = conf.length ? `<div class="alert warn">${ic('alert')}Conflito: este profissional já tem ${conf.map(x => `${x.hora} (${esc(DB.get('clientes', x.clienteId)?.nome || '')})`).join(', ')} neste horário.</div>` : '';
        };
        F.servicoId.onchange = () => { const s = DB.get('servicos', F.servicoId.value); if (s) { F.duracaoMin.value = s.duracaoMin; F.valorPrevisto.value = s.precoBase; if (s.tipo === 'tattoo' && !F.sinal.value) F.sinal.value = Math.round(s.precoBase * 0.3 / 10) * 10; } checkConf(); };
        ['data', 'hora', 'duracaoMin', 'profissionalId'].forEach(n => F[n].addEventListener('change', checkConf)); checkConf();
        const projOpts = () => { m.$('#agProj').innerHTML = Forms.projetoOpts(F.clienteId.value, a.projetoId); };
        F.clienteId.addEventListener('change', projOpts); projOpts();
        if (Perm.isArtista()) { F.profissionalId.value = Perm.profId(); F.profissionalId.disabled = true; }
        m.$('#agCli').onclick = () => Forms.clienteRapido(c => { const o = new Option(c.nome, c.id, true, true); F.clienteId.add(o); });
        if (edit) m.$('#agDel').onclick = () => UI.confirm('Excluir este agendamento?', () => { DB.all('lancamentos').filter(l => l.origem === 'sinal:' + a.id).forEach(l => DB.remove('lancamentos', l.id, true)); DB.remove('agendamentos', a.id); m.close(); UI.toast('Agendamento excluído'); });
        m.$('#agOk').onclick = () => {
          const d = UI.formData(F); if (Perm.isArtista()) d.profissionalId = Perm.profId();
          if (!d.clienteId || !d.profissionalId || !d.servicoId || !d.data || !d.hora) return UI.toast('Preencha cliente, profissional, serviço, data e hora', 'warn');
          const ag = DB.save('agendamentos', { ...a, ...d }, true);
          const ref = 'sinal:' + ag.id; const ex = DB.all('lancamentos').filter(l => l.origem === ref);
          const podeRefazer = Perm.gestao(); // tatuador não lê/edita o financeiro: só lança o sinal uma vez
          if (podeRefazer) ex.forEach(l => DB.remove('lancamentos', l.id, true));
          if (ag.sinalPago && ag.sinal > 0 && (podeRefazer || !a.sinalLancado)) { ag.sinalLancado = true; DB.save('agendamentos', ag, true); } else if (!ag.sinalPago && podeRefazer) { ag.sinalLancado = false; DB.save('agendamentos', ag, true); }
          if (ag.sinalPago && ag.sinal > 0 && (podeRefazer || !a.sinalLancado)) Biz.lancReceita({ valor: ag.sinal, categoria: 'Sinal/Adiantamento', descricao: `Sinal — ${DB.get('clientes', ag.clienteId)?.nome || ''} (${fdate(ag.data)})`, data: ex[0]?.data || today(), forma: ag.formaSinal, origem: ref, clienteId: ag.clienteId });
          DB.emit(); m.close(); UI.toast('Agendamento salvo');
        };
      }
    });
  },

  verAgendamento(id) {
    const a = DB.get('agendamentos', id); if (!a) return;
    const c = DB.get('clientes', a.clienteId), p = DB.get('profissionais', a.profissionalId), s = DB.get('servicos', a.servicoId);

    UI.modal({ title: `${a.hora} · ${esc(c?.nome || '')}`, body: `
      <div class="row mb">${UI.statusPill(a.status)}<span class="pill" style="color:${p?.cor}">● ${esc(p?.nome || '')}</span><span class="pill">${esc(s?.nome || '')}</span></div>
      <div class="grid g3"><div><small class="muted">Data</small><div class="strong">${fdate(a.data)} · ${a.hora} (${a.duracaoMin} min)</div></div><div><small class="muted">Valor previsto</small><div class="strong">${brl(a.valorPrevisto)}</div></div><div><small class="muted">Sinal</small><div class="strong">${brl(a.sinal)} ${a.sinal ? (a.sinalPago ? '<span class="pill ok">pago</span>' : '<span class="pill warn">pendente</span>') : ''}</div></div></div>
      ${a.obs ? `<div class="alert info mt">${esc(a.obs)}</div>` : ''}
      <div class="hr"></div>
      <b>Ficha de anamnese</b>
      ${ana ? `<div class="row mt">${UI.statusPill(ana.status)}<span class="muted small">enviada em ${fdt(ana.criadoEm)}</span><button class="btn sm" id="vaVer">${ic('eye')} Ver ficha</button></div>${alertas.length ? `<div class="alert warn mt">${ic('alert')}<div><b>Atenção:</b> ${alertas.map(esc).join(' · ')}</div></div>` : '<div class="alert ok mt">Nenhum ponto de atenção na ficha.</div>'}`
        : `<div class="alert warn mt">${ic('alert')}Cliente ainda não preencheu a ficha de anamnese.</div><button class="btn sm mt" id="vaLink">${ic('link')} Enviar link da ficha</button>`}`,
      foot: `<a class="btn" target="_blank" href="${UI.wa(c?.telefone, msgConf)}">${ic('wa')} Confirmar no WhatsApp</a><span class="grow"></span>
        <button class="btn" id="vaEd">${ic('edit')} Editar</button>
        ${a.status !== 'concluido' ? `<button class="btn" id="vaConf">${ic('check')} Confirmado</button><button class="btn pri" id="vaAt">${ic('needle')} Iniciar atendimento</button>` : (a.atendimentoId ? `<button class="btn" id="vaVerAt">Ver atendimento</button>` : '')}`,
      onOpen: m => {
        m.$('#vaEd').onclick = () => { m.close(); Forms.agendamento(a); };
        if (m.$('#vaVer')) m.$('#vaVer').onclick = () => Forms.verAnamnese(ana.id);
        if (m.$('#vaLink')) m.$('#vaLink').onclick = () => Forms.linkAnamnese(c);
        if (m.$('#vaConf')) m.$('#vaConf').onclick = () => { a.status = 'confirmado'; DB.save('agendamentos', a); m.close(); UI.toast('Agendamento confirmado'); };
        if (m.$('#vaAt')) m.$('#vaAt').onclick = () => { m.close(); Forms.atendimento({ clienteId: a.clienteId, profissionalId: a.profissionalId, servicoId: a.servicoId, data: a.data, hora: a.hora, valor: a.valorPrevisto, sinal: a.sinalPago ? a.sinal : 0, agendamentoId: a.id, descricao: a.obs, projetoId: a.projetoId || '' }); };
        if (m.$('#vaVerAt')) m.$('#vaVerAt').onclick = () => Forms.verAtendimento(a.atendimentoId);
