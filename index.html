  atendimento(at = {}) {
    const edit = !!at.id;
    at = { data: today(), hora: new Date().toTimeString().slice(0, 5), forma: 'PIX', desconto: 0, sinal: 0, insumos: [], joias: [], ...at };
    if (!edit && at.servicoId && !at.insumos.length) { const s = DB.get('servicos', at.servicoId); if (s) at.insumos = (s.kit || []).map(k => ({ ...k })); }
    const insOpts = UI.opts('insumos', { empty: '— insumo —', label: i => `${i.nome} (${i.unidade})` });
    const joOpts = UI.opts('joias', { empty: '— joia —', label: j => `${j.nome} ${j.bitola || ''} · ${brl(j.preco)} · est. ${j.qtd}` });
    const insRow = (r = {}) => `<tr><td><select data-k="insumoId">${insOpts.map(([v, t]) => `<option value="${v}" ${v === r.insumoId ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td><td style="width:110px"><input type="number" step="any" data-k="qtd" value="${r.qtd ?? 1}"></td><td class="num" data-cu style="width:110px"></td><td style="width:40px"><button type="button" class="btn sm icon danger" data-rm>${ic('x')}</button></td></tr>`;
    const joRow = (r = {}) => `<tr><td><select data-k="joiaId">${joOpts.map(([v, t]) => `<option value="${v}" ${v === r.joiaId ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td><td style="width:80px"><input type="number" data-k="qtd" value="${r.qtd ?? 1}"></td><td style="width:120px"><input type="number" step="any" data-k="preco" value="${r.preco ?? ''}" placeholder="preço"></td><td style="width:40px"><button type="button" class="btn sm icon danger" data-rm>${ic('x')}</button></td></tr>`;
    UI.modal({ title: edit ? 'Editar atendimento' : 'Registrar atendimento', size: 'lg', body: `<form class="fg" id="atF">
      <div class="f c6"><label>Cliente *</label><div class="row"><select name="clienteId" style="flex:1">${UI.opts('clientes').map(([v, t]) => `<option value="${v}" ${v === at.clienteId ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select><button type="button" class="btn icon" id="atCli">${ic('plus')}</button></div></div>
      ${UI.f('Profissional *', 'profissionalId', at.profissionalId, { type: 'select', col: 3, opts: UI.opts('profissionais', { filter: p => p.comissaoPct > 0 || p.id === at.profissionalId }) })}
      ${UI.f('Serviço *', 'servicoId', at.servicoId, { type: 'select', col: 3, opts: UI.opts('servicos') })}
      <div class="c12" id="atAna"></div>
      ${UI.f('Data', 'data', at.data, { type: 'date', col: 3 })}${UI.f('Hora', 'hora', at.hora, { type: 'time', col: 2 })}
      ${UI.f('Descrição / arte', 'descricao', at.descricao, { col: 4, ph: 'Ex.: rosa fine line' })}${UI.f('Região do corpo', 'regiao', at.regiao, { col: 3, ph: 'Ex.: antebraço' })}
      <div class="f c6"><label>Lote esterilizado (autoclave) ${ic('shield', 'ic-in')}</label><select name="loteEsterilizacao">${Forms.loteOpts(at.data, at.loteEsterilizacao)}</select><span class="help" id="atLoteH"></span></div>
      <div class="f c6"><label>Projeto (várias sessões)</label><select name="projetoId" id="atProj"></select><span class="help" id="atProjH"></span></div>
      <div class="fsec">Valores</div>
      ${UI.f('Valor do serviço (R$) *', 'valor', at.valor, { type: 'number', col: 3 })}${UI.f('Desconto (R$)', 'desconto', at.desconto, { type: 'number', col: 2 })}
      ${UI.f('Sinal já recebido', 'sinal', at.sinal, { type: 'number', col: 2, help: 'abatido do valor a receber' })}
      ${UI.f('Forma de pagamento', 'forma', at.forma, { type: 'select', col: 3, opts: FORMAS })}${UI.f('Comissão %', 'comissaoPct', at.comissaoPct ?? '', { type: 'number', col: 2, ph: 'padrão' })}
      <div class="fsec">Insumos utilizados <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— carregados do kit do serviço, ajuste conforme o uso real</span></div>
      <div class="c12"><div class="tbl-wrap"><table class="tbl" id="insT"><thead><tr><th>Insumo</th><th>Qtd</th><th class="num">Custo</th><th></th></tr></thead><tbody>${at.insumos.map(insRow).join('')}</tbody></table></div><button type="button" class="btn sm mt" id="addIns">${ic('plus')} Insumo</button> <button type="button" class="btn sm mt" id="kitIns">${ic('repeat')} Recarregar kit do serviço</button></div>
      <div class="fsec">Joias aplicadas (piercing)</div>
      <div class="c12"><div class="tbl-wrap"><table class="tbl" id="joT"><thead><tr><th>Joia</th><th>Qtd</th><th>Preço un.</th><th></th></tr></thead><tbody>${at.joias.map(joRow).join('')}</tbody></table></div><button type="button" class="btn sm mt" id="addJo">${ic('plus')} Joia</button></div>
      ${UI.f('Observações', 'obs', at.obs, { type: 'textarea', col: 12 })}
      <div class="c12 calc-box" id="atCalc"></div></form>`,
      foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="atOk">${ic('check')} ${edit ? 'Salvar alterações' : 'Concluir atendimento'}</button>`,
      onOpen: m => {
        const F = m.$('#atF');
        const readRows = (sel) => $$(sel + ' tbody tr', m.el).map(tr => { const o = {}; $$('[data-k]', tr).forEach(i => o[i.dataset.k] = i.type === 'number' ? +i.value : i.value); return o; });
        const calc = () => {
          const d = UI.formData(F); const prof = DB.get('profissionais', d.profissionalId);
          const ins = readRows('#insT'), jo = readRows('#joT');
          $$('#insT tbody tr', m.el).forEach((tr, i) => { const it = DB.get('insumos', ins[i].insumoId); $('[data-cu]', tr).innerHTML = it ? `${brl(it.custoUnit * ins[i].qtd)}${it.qtd < ins[i].qtd ? '<small class="down">estoque insuficiente</small>' : ''}` : '—'; });
          const ci = sum(ins, r => { const it = DB.get('insumos', r.insumoId); return it ? it.custoUnit * r.qtd : 0; });
          const tj = sum(jo, r => r.qtd * (r.preco || DB.get('joias', r.joiaId)?.preco || 0)), cj = sum(jo, r => r.qtd * (DB.get('joias', r.joiaId)?.custo || 0));
          const vl = (+d.valor || 0) - (+d.desconto || 0); const cp = d.comissaoPct !== '' ? +d.comissaoPct : (prof?.comissaoPct || 0); const cv = vl * cp / 100;
          const tx = (vl - (+d.sinal || 0) + tj) * Biz.taxaForma(d.forma) / 100; const lucro = vl + tj - ci - cj - cv - tx;
          m.$('#atCalc').innerHTML = `<div><small>Total cliente</small><b>${brl(vl + tj)}</b></div><div><small>A receber agora</small><b>${brl(vl + tj - (+d.sinal || 0))}</b></div><div><small>Custo insumos</small><b>${brl(ci)}</b></div><div><small>Custo joias</small><b>${brl(cj)}</b></div><div><small>Comissão (${cp}%)</small><b>${brl(cv)}</b></div><div><small>Taxa ${esc(d.forma)}</small><b>${brl(tx)}</b></div><div><small>Lucro do estúdio</small><b class="${lucro < 0 ? 'down' : 'up'}">${brl(lucro)} · ${pct(vl + tj ? lucro / (vl + tj) * 100 : 0)}</b></div>`;
        };
        const anaCheck = () => {
          const cid = F.clienteId.value; if (!cid) { m.$('#atAna').innerHTML = ''; return; }
          const ana = DB.all('anamneses').filter(x => x.clienteId === cid).sort((x, y) => (y.criadoEm || '').localeCompare(x.criadoEm || ''))[0];
          const al = ana ? Biz.anamneseAlertas(ana) : [];
          m.$('#atAna').innerHTML = !ana ? `<div class="alert warn">${ic('alert')}<div>Cliente sem ficha de anamnese. <a href="#" id="atLk">Enviar link agora</a></div></div>` : al.length ? `<div class="alert warn">${ic('alert')}<div><b>Ficha de anamnese:</b> ${al.map(esc).join(' · ')}</div></div>` : `<div class="alert ok">${ic('check')}Ficha de anamnese OK (${fdate(ana.criadoEm)})</div>`;
          if (m.$('#atLk')) m.$('#atLk').onclick = e => { e.preventDefault(); Forms.linkAnamnese(DB.get('clientes', cid)); };
        };
        const bindRows = () => { $$('[data-rm]', m.el).forEach(b => b.onclick = () => { b.closest('tr').remove(); calc(); }); };
        m.el.addEventListener('input', calc); m.el.addEventListener('change', calc);
        F.clienteId.addEventListener('change', anaCheck);
        const projSync = () => { m.$('#atProj').innerHTML = Forms.projetoOpts(F.clienteId.value, at.projetoId); projHelp(); };
        const projHelp = () => { const p = DB.get('projetos', F.projetoId.value); if (!p) { m.$('#atProjH').textContent = ''; return; } const i = Views.orcamentos.info(p, at.id); m.$('#atProjH').textContent = `Sessão ${i.feitas + 1} de ${p.sessoesPrevistas} · saldo ${brl(i.saldo)}`; if (!F.valor.value) F.valor.value = Math.max(0, Math.round(i.saldo / Math.max(1, p.sessoesPrevistas - i.feitas))); };
        F.clienteId.addEventListener('change', projSync); F.projetoId.addEventListener('change', () => { projHelp(); calc(); }); projSync();
        const loteH = () => { const e = DB.get('esterilizacoes', F.loteEsterilizacao.value), s = DB.get('servicos', F.servicoId.value); m.$('#atLoteH').innerHTML = e ? `Válido até ${fdate(e.validade)} · ${esc((e.itens || []).join(', '))}` : (s?.tipo === 'piercing' ? '<span class="down">Piercing: informe o lote do material esterilizado (rastreabilidade)</span>' : 'Opcional para tattoo com material 100% descartável'); };
        F.data.addEventListener('change', () => { F.loteEsterilizacao.innerHTML = Forms.loteOpts(F.data.value, F.loteEsterilizacao.value); loteH(); });
        F.loteEsterilizacao.addEventListener('change', loteH); F.servicoId.addEventListener('change', loteH); loteH();
        if (Perm.isArtista() && !edit) { F.profissionalId.value = Perm.profId(); F.profissionalId.disabled = true; }
        F.servicoId.addEventListener('change', () => { const s = DB.get('servicos', F.servicoId.value); if (!s) return; if (!F.valor.value) F.valor.value = s.precoBase; $('#insT tbody', m.el).innerHTML = (s.kit || []).map(insRow).join(''); bindRows(); calc(); });
        F.profissionalId.addEventListener('change', () => { F.comissaoPct.value = ''; calc(); });
        m.$('#addIns').onclick = () => { $('#insT tbody', m.el).insertAdjacentHTML('beforeend', insRow()); bindRows(); calc(); };
        m.$('#kitIns').onclick = () => { const s = DB.get('servicos', F.servicoId.value); if (!s) return UI.toast('Escolha o serviço', 'warn'); $('#insT tbody', m.el).innerHTML = (s.kit || []).map(insRow).join(''); bindRows(); calc(); };
        m.$('#addJo').onclick = () => { $('#joT tbody', m.el).insertAdjacentHTML('beforeend', joRow()); bindRows(); calc(); };
        m.el.addEventListener('change', e => { if (e.target.dataset.k === 'joiaId') { const j = DB.get('joias', e.target.value); const p = e.target.closest('tr').querySelector('[data-k=preco]'); if (j && !p.value) p.value = j.preco; calc(); } });
        m.$('#atCli').onclick = () => Forms.clienteRapido(c => { F.clienteId.add(new Option(c.nome, c.id, true, true)); anaCheck(); });
        bindRows(); calc(); anaCheck();
        m.$('#atOk').onclick = () => {
          const d = UI.formData(F); if (Perm.isArtista()) d.profissionalId = Perm.profId();
          if (!d.clienteId || !d.profissionalId || !d.servicoId || !(+d.valor >= 0) || d.valor === '') return UI.toast('Preencha cliente, profissional, serviço e valor', 'warn');
          const rec = { ...at, ...d, insumos: readRows('#insT'), joias: readRows('#joT') };
          Biz.registrarAtendimento(rec); m.close(); UI.toast(edit ? 'Atendimento atualizado' : 'Atendimento registrado — estoque e financeiro atualizados');
        };
      }
    });
  },

  verAtendimento(id) {
    const a = DB.get('atendimentos', id); if (!a) return;
    const c = DB.get('clientes', a.clienteId), p = DB.get('profissionais', a.profissionalId), s = DB.get('servicos', a.servicoId);
    UI.modal({ title: `Atendimento — ${esc(c?.nome || '')}`, size: 'lg', body: `
      <div class="grid g4"><div><small class="muted">Data</small><div class="strong">${fdate(a.data)} ${a.hora || ''}</div></div><div><small class="muted">Serviço</small><div class="strong">${esc(s?.nome || '')}</div></div><div><small class="muted">Profissional</small><div class="strong">${esc(p?.nome || '')}</div></div><div><small class="muted">Região</small><div class="strong">${esc(a.regiao || '—')}</div></div></div>
      ${a.descricao ? `<p class="mt">${esc(a.descricao)}</p>` : ''}
      <div class="row mt">${a.loteEsterilizacao && DB.get('esterilizacoes', a.loteEsterilizacao) ? `<span class="pill ok">${ic('shield', 'ic-in')} Lote ${esc(DB.get('esterilizacoes', a.loteEsterilizacao).lote)}</span>` : '<span class="pill">Sem lote de esterilização</span>'}${a.projetoId && DB.get('projetos', a.projetoId) ? `<span class="pill info">Projeto: ${esc(DB.get('projetos', a.projetoId).titulo)}</span>` : ''}</div>
      <h3 class="mt" style="font-size:13px;color:var(--muted);margin-bottom:8px">FOTOS DO TRABALHO</h3><div id="atFotos"></div>
      <div class="calc-box mt"><div><small>Serviço</small><b>${brl(a.valorLiquido)}</b></div><div><small>Joias</small><b>${brl(a.totalJoias || 0)}</b></div><div><small>Insumos</small><b>${brl(a.custoInsumos)}</b></div><div><small>Comissão</small><b>${brl(a.comissaoValor)}</b></div><div><small>Pagamento</small><b>${esc(a.forma)}</b></div></div>
      <h3 class="mt" style="font-size:13px;color:var(--muted);margin-bottom:8px">INSUMOS BAIXADOS DO ESTOQUE</h3>
      ${UI.table([{ t: 'Insumo', v: r => esc(DB.get('insumos', r.insumoId)?.nome || '(removido)') }, { t: 'Qtd', cls: 'num', v: r => `${num(r.qtd)} ${DB.get('insumos', r.insumoId)?.unidade || ''}` }, { t: 'Custo un.', cls: 'num', v: r => brl(r.custoUnit) }, { t: 'Total', cls: 'num', v: r => brl(r.qtd * r.custoUnit) }], a.insumos || [], { emptyMsg: 'Nenhum insumo' })}
      ${(a.joias || []).length ? `<h3 class="mt" style="font-size:13px;color:var(--muted);margin-bottom:8px">JOIAS</h3>${UI.table([{ t: 'Joia', v: r => esc(DB.get('joias', r.joiaId)?.nome || '') }, { t: 'Qtd', cls: 'num', v: r => r.qtd }, { t: 'Preço', cls: 'num', v: r => brl(r.preco) }, { t: 'Custo', cls: 'num', v: r => brl(r.custo) }], a.joias)}` : ''}`,
      foot: `<button class="btn" onclick="window.print()">${ic('print')} Imprimir</button><span class="grow"></span><button class="btn" data-close>Fechar</button>`,
      onOpen: m => Fotos.widget(m.$('#atFotos'), { refTipo: 'atendimento', refId: a.id, clienteId: a.clienteId, profissionalId: a.profissionalId, projetoId: a.projetoId || '' }, { tipos: ['Antes', 'Depois', 'Cicatrizado', 'Arte / stencil'] }) });
  }
};

</script>
  <script>
/* ===== views-cadastros.js ===== */
/* ============================================================
   CLIENTES · ANAMNESES · EQUIPE · SERVIÇOS
   ============================================================ */

/* ---------------- CLIENTES ---------------- */
Views.clientes = {
  title: 'Clientes', st: { q: '', ord: 'nome' },
  sub() { return DB.all('clientes').length + ' clientes cadastrados'; },
  render(el) {
    const st = this.st;
    App.actions(`<button class="btn" id="cCsv">${ic('download')} CSV</button><button class="btn" id="cLink">${ic('link')} Link da ficha</button><button class="btn pri" id="cNovo">${ic('plus')} Novo cliente</button>`);
    el.innerHTML = `<div class="toolbar"><div class="search">${ic('search')}<input id="q" placeholder="Buscar por nome, telefone, Instagram, CPF..." value="${esc(st.q)}"></div>
      <select id="ord" style="width:auto">${[['nome', 'Ordenar: nome'], ['gasto', 'Maior gasto'], ['ultima', 'Última visita'], ['novo', 'Mais recentes']].map(([v, t]) => `<option value="${v}" ${st.ord === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div id="lst"></div>`;
    const stats = {};
    DB.all('atendimentos').forEach(a => { const s = stats[a.clienteId] ||= { n: 0, v: 0, u: '' }; s.n++; s.v += a.valorLiquido + (a.totalJoias || 0); if (a.data > s.u) s.u = a.data; });
    DB.all('vendas').forEach(v => { if (!v.clienteId) return; const s = stats[v.clienteId] ||= { n: 0, v: 0, u: '' }; s.v += v.total; if (v.data > s.u) s.u = v.data; });
    const anaSet = new Set(DB.all('anamneses').map(a => a.clienteId));
    const draw = () => {
      const q = st.q.toLowerCase();
      let rows = DB.all('clientes').filter(c => !q || [c.nome, c.telefone, c.instagram, c.cpf, c.email].join(' ').toLowerCase().includes(q)).map(c => ({ ...c, _s: stats[c.id] || { n: 0, v: 0, u: '' } }));
      const o = { nome: (a, b) => a.nome.localeCompare(b.nome), gasto: (a, b) => b._s.v - a._s.v, ultima: (a, b) => b._s.u.localeCompare(a._s.u), novo: (a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || '') };
      rows.sort(o[st.ord]); this._rows = rows;
      $('#lst', el).innerHTML = UI.table([
        { t: 'Cliente', v: c => `<div class="row" style="flex-wrap:nowrap"><div class="avatar">${initials(c.nome)}</div><div><span class="strong">${esc(c.nome)}</span><small>${esc(c.instagram || '')} ${c.nasc ? '· ' + idade(c.nasc) + ' anos' : ''}</small></div></div>` },
        { t: 'Contato', v: c => `${esc(c.telefone || '—')}<small>${esc(c.email || '')}</small>` },
        { t: 'Origem', v: c => `<span class="pill">${esc(c.origem || '—')}</span>` },
        { t: 'Ficha', v: c => anaSet.has(c.id) ? '<span class="pill ok">OK</span>' : '<span class="pill warn">Pendente</span>' },
        { t: 'Atend.', cls: 'num', v: c => c._s.n },
        { t: 'Total gasto', cls: 'num', v: c => `<b>${brl(c._s.v)}</b>` },
        { t: 'Última visita', v: c => fdate(c._s.u) },
        { t: '', cls: 'act', v: c => `<a class="btn sm icon" target="_blank" href="${UI.wa(c.telefone, '')}" title="WhatsApp">${ic('wa')}</a><button class="btn sm icon" data-v="${c.id}" title="Ficha do cliente">${ic('eye')}</button><button class="btn sm icon" data-e="${c.id}">${ic('edit')}</button>` }
      ], rows, { emptyMsg: 'Nenhum cliente encontrado' });
      $$('[data-v]', el).forEach(b => b.onclick = () => this.ver(b.dataset.v));
      $$('[data-e]', el).forEach(b => b.onclick = () => this.form(DB.get('clientes', b.dataset.e)));
    };
    draw();
    $('#q').oninput = e => { st.q = e.target.value; draw(); };
    $('#ord').onchange = e => { st.ord = e.target.value; draw(); };
    $('#cNovo').onclick = () => this.form();
    $('#cLink').onclick = () => Forms.linkAnamnese();
    $('#cCsv').onclick = () => UI.download('clientes.csv', UI.csv([['Nome', 'Telefone', 'E-mail', 'Instagram', 'Nascimento', 'CPF', 'Cidade', 'Origem', 'Atendimentos', 'Total gasto', 'Última visita'], ...this._rows.map(c => [c.nome, c.telefone, c.email, c.instagram, fdate(c.nasc), c.cpf, c.cidade, c.origem, c._s.n, num(c._s.v), fdate(c._s.u)])]), 'text/csv');
  },

  form(c = {}) {
    const edit = !!c.id;
    UI.modal({ title: edit ? 'Editar cliente' : 'Novo cliente', body: `<form class="fg" id="cF">
      ${UI.f('Nome completo *', 'nome', c.nome, { col: 8 })}${UI.f('CPF', 'cpf', c.cpf, { col: 4, ph: '000.000.000-00' })}
      ${UI.f('WhatsApp', 'telefone', c.telefone, { col: 4, ph: '(00) 00000-0000' })}${UI.f('E-mail', 'email', c.email, { type: 'email', col: 4 })}${UI.f('Instagram', 'instagram', c.instagram, { col: 4, ph: '@usuario' })}
      ${UI.f('Nascimento', 'nasc', c.nasc, { type: 'date', col: 4 })}${UI.f('Cidade', 'cidade', c.cidade, { col: 4 })}${UI.f('Como conheceu', 'origem', c.origem, { type: 'select', col: 4, opts: ['', 'Instagram', 'TikTok', 'Indicação', 'Google', 'Passou na frente', 'Evento', 'Outro'] })}
      ${UI.f('Endereço', 'endereco', c.endereco, { col: 12 })}
      ${UI.f('Observações (preferências, estilo, histórico)', 'obs', c.obs, { type: 'textarea', col: 12 })}</form>`,
      foot: `${edit ? `<button class="btn danger" id="cDel">${ic('trash')} Excluir</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn pri" id="cOk">Salvar</button>`,
      onOpen: m => {
        m.$('#cOk').onclick = () => { const d = UI.formData(m.$('#cF')); if (!d.nome) return UI.toast('Informe o nome', 'warn'); DB.save('clientes', { ...c, ...d }); m.close(); UI.toast('Cliente salvo'); };
        if (edit) m.$('#cDel').onclick = () => {
          if (DB.all('atendimentos').some(a => a.clienteId === c.id)) return UI.toast('Cliente possui atendimentos — não pode ser excluído', 'warn');
          UI.confirm(`Excluir ${esc(c.nome)}?`, () => { DB.remove('clientes', c.id); m.close(); });
        };
      }
    });
  },

  ver(id) {
    const c = DB.get('clientes', id); if (!c) return;
    const ats = DB.all('atendimentos').filter(a => a.clienteId === id).sort((a, b) => b.data.localeCompare(a.data));
    const vds = DB.all('vendas').filter(v => v.clienteId === id).sort((a, b) => b.data.localeCompare(a.data));
    const anas = DB.all('anamneses').filter(a => a.clienteId === id).sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));
    const ags = DB.all('agendamentos').filter(a => a.clienteId === id && a.data >= today() && !['cancelado', 'concluido'].includes(a.status)).sort((a, b) => a.data.localeCompare(b.data));
    const tot = sum(ats, a => a.valorLiquido + (a.totalJoias || 0)) + sum(vds, v => v.total);
    UI.modal({ title: esc(c.nome), size: 'lg', body: `
      <div class="grid g4">
        <div class="card kpi"><div class="lbl">Total gasto</div><div class="val">${brl(tot)}</div></div>
        <div class="card kpi"><div class="lbl">Atendimentos</div><div class="val">${ats.length}</div><div class="hint">${ats.filter(a => a.tipo === 'tattoo').length} tattoo · ${ats.filter(a => a.tipo === 'piercing').length} piercing</div></div>
        <div class="card kpi"><div class="lbl">Ticket médio</div><div class="val">${brl(ats.length ? tot / ats.length : 0)}</div></div>
        <div class="card kpi"><div class="lbl">Cliente desde</div><div class="val" style="font-size:18px">${fdate(c.criadoEm)}</div></div>
      </div>
      <div class="grid g3 mt small"><div><span class="muted">WhatsApp:</span> ${esc(c.telefone || '—')}</div><div><span class="muted">Instagram:</span> ${esc(c.instagram || '—')}</div><div><span class="muted">Nascimento:</span> ${fdate(c.nasc)} ${c.nasc ? `(${idade(c.nasc)} anos)` : ''}</div><div><span class="muted">E-mail:</span> ${esc(c.email || '—')}</div><div><span class="muted">CPF:</span> ${esc(c.cpf || '—')}</div><div><span class="muted">Origem:</span> ${esc(c.origem || '—')}</div></div>
      ${c.obs ? `<div class="alert info mt">${esc(c.obs)}</div>` : ''}
      ${ags.length ? `<h3 class="mt mb" style="font-size:13px;color:var(--muted)">PRÓXIMOS AGENDAMENTOS</h3>${ags.map(a => `<div class="li"><div class="time-chip">${fdate(a.data).slice(0, 5)}</div><div><div class="t">${a.hora} · ${esc(DB.get('servicos', a.servicoId)?.nome || '')}</div><small>${esc(DB.get('profissionais', a.profissionalId)?.nome || '')}</small></div><div class="r">${UI.statusPill(a.status)}</div></div>`).join('')}` : ''}
      <h3 class="mt mb" style="font-size:13px;color:var(--muted)">FICHAS DE ANAMNESE</h3>
      ${anas.length ? anas.map(a => `<div class="li"><div>${UI.statusPill(a.status)}</div><div><div class="t">${a.tipoProcedimento === 'piercing' ? 'Piercing' : 'Tatuagem'} — ${fdt(a.criadoEm)}</div><small>${Biz.anamneseAlertas(a).map(esc).join(' · ') || 'Sem pontos de atenção'}</small></div><div class="r"><button class="btn sm" data-ana="${a.id}">${ic('eye')} Ver</button></div></div>`).join('') : '<div class="alert warn">Nenhuma ficha preenchida.</div>'}
      ${DB.all('projetos').filter(p => p.clienteId === id).length ? `<h3 class="mt mb" style="font-size:13px;color:var(--muted)">PROJETOS</h3>${DB.all('projetos').filter(p => p.clienteId === id).map(p => { const i = Views.orcamentos.info(p); return `<div class="li"><div><div class="t">${esc(p.titulo)}</div><small>${i.feitas}/${p.sessoesPrevistas} sessões · pago ${brl(i.pago)} de ${brl(p.valorTotal)}</small></div><div class="r">${UI.statusPill(p.status)}</div></div>`; }).join('')}` : ''}
      <h3 class="mt mb" style="font-size:13px;color:var(--muted)">HISTÓRICO</h3>
      ${UI.table([{ t: 'Data', v: a => fdate(a.data) }, { t: 'Serviço', v: a => `${esc(DB.get('servicos', a.servicoId)?.nome || '')}<small>${esc(a.descricao || '')} ${a.regiao ? '· ' + esc(a.regiao) : ''}</small>` }, { t: 'Profissional', v: a => esc(DB.get('profissionais', a.profissionalId)?.nome || '') }, { t: 'Valor', cls: 'num', v: a => brl(a.valorLiquido + (a.totalJoias || 0)) }], ats, { emptyMsg: 'Sem atendimentos' })}
      <h3 class="mt mb" style="font-size:13px;color:var(--muted)">FOTOS</h3><div id="cliFotos"></div>
      ${vds.length ? `<h3 class="mt mb" style="font-size:13px;color:var(--muted)">COMPRAS NO BALCÃO</h3>${UI.table([{ t: 'Data', v: v => fdate(v.data) }, { t: 'Itens', v: v => v.itens.map(i => `${i.qtd}× ${esc(i.nome)}`).join(', ') }, { t: 'Total', cls: 'num', v: v => brl(v.total) }], vds)}` : ''}`,
      foot: `<a class="btn" target="_blank" href="${UI.wa(c.telefone, '')}">${ic('wa')} WhatsApp</a><button class="btn" id="vcLink">${ic('link')} Enviar ficha</button><span class="grow"></span><button class="btn" id="vcAg">${ic('cal')} Agendar</button><button class="btn" id="vcEd">${ic('edit')} Editar</button><button class="btn pri" id="vcAt">${ic('needle')} Novo atendimento</button>`,
      onOpen: m => {
        $$('[data-ana]', m.el).forEach(b => b.onclick = () => Forms.verAnamnese(b.dataset.ana));
        Fotos.widget(m.$('#cliFotos'), { clienteId: c.id }, { readonly: true, emptyMsg: 'Nenhuma foto deste cliente ainda — adicione pelos atendimentos' });
        m.$('#vcLink').onclick = () => Forms.linkAnamnese(c);
        m.$('#vcEd').onclick = () => { m.close(); this.form(c); };
        m.$('#vcAg').onclick = () => { m.close(); Forms.agendamento({ clienteId: c.id }); };
        m.$('#vcAt').onclick = () => { m.close(); Forms.atendimento({ clienteId: c.id }); };
      }
    });
  }
};

/* ---------------- ANAMNESES ---------------- */
Views.anamneses = {
  title: 'Fichas de Anamnese', st: { tab: 'nova', q: '' },
  sub() { return 'Fichas preenchidas online pelos clientes chegam aqui em tempo real'; },
  render(el) {
    const st = this.st, all = DB.all('anamneses');
    App.actions(`<button class="btn pri" id="anLink">${ic('link')} Link da ficha para clientes</button>`);
    const cnt = s => all.filter(a => a.status === s).length;
    el.innerHTML = `<div class="toolbar"><div class="tabs">${[['nova', `Novas (${cnt('nova')})`], ['revisada', `Revisadas (${cnt('revisada')})`], ['arquivada', 'Arquivadas'], ['', 'Todas']].map(([k, t]) => `<button data-t="${k}" class="${st.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div class="search">${ic('search')}<input id="q" placeholder="Buscar por nome, CPF..." value="${esc(st.q)}"></div></div>
      <div class="alert info mb">${ic('file')}<div>Envie o link para o cliente pelo WhatsApp (botão acima, na agenda ou na ficha do cliente). Ele preenche no celular, assina com o dedo e a ficha aparece aqui como <b>Nova</b>. Fichas com respostas de risco aparecem destacadas.</div></div><div id="lst"></div>`;
    const draw = () => {
      const q = st.q.toLowerCase();
      const rows = all.filter(a => (!st.tab || a.status === st.tab) && (!q || [a.nome, a.cpf, a.telefone].join(' ').toLowerCase().includes(q))).sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));
      $('#lst', el).innerHTML = UI.table([
        { t: 'Recebida', v: a => fdt(a.criadoEm) },
        { t: 'Cliente', v: a => `<span class="strong">${esc(a.nome)}</span><small>${esc(a.telefone || '')} ${a.nasc ? '· ' + idade(a.nasc) + ' anos' : ''}</small>` },
        { t: 'Procedimento', v: a => `${a.tipoProcedimento === 'piercing' ? '<span class="pill info">Piercing</span>' : '<span class="pill acc">Tatuagem</span>'}<small>${esc(a.regiao || '')}</small>` },
        { t: 'Atenção', v: a => { const al = Biz.anamneseAlertas(a); const menor = a.nasc && idade(a.nasc) < 18; return (menor ? '<span class="pill bad">MENOR DE IDADE</span> ' : '') + (al.length ? `<span class="pill warn">${al.length} ponto(s)</span><small>${esc(al.slice(0, 3).join(', '))}</small>` : '<span class="pill ok">OK</span>'); } },
        { t: 'Vínculo', v: a => a.clienteId && DB.get('clientes', a.clienteId) ? `<span class="pill ok">Cliente</span>` : '<span class="pill warn">Sem vínculo</span>' },
        { t: 'Status', v: a => UI.statusPill(a.status) },
        { t: '', cls: 'act', v: a => `<button class="btn sm" data-v="${a.id}">${ic('eye')} Abrir</button>` }
      ], rows, { emptyMsg: 'Nenhuma ficha aqui' });
      $$('[data-v]', el).forEach(b => b.onclick = () => Forms.verAnamnese(b.dataset.v));
    };
    draw();
    $('#q').oninput = e => { st.q = e.target.value; draw(); };
    $$('[data-t]', el).forEach(b => b.onclick = () => { st.tab = b.dataset.t; this.render(el); });
    $('#anLink').onclick = () => Forms.linkAnamnese();
  }
};

Forms.verAnamnese = id => {
  const a = DB.get('anamneses', id); if (!a) return;
  const r = a.respostas || {}, det = a.detalhes || {}, al = Biz.anamneseAlertas(a), menor = a.nasc && idade(a.nasc) < 18;
  const cli = DB.get('clientes', a.clienteId);
  const match = !cli ? DB.all('clientes').find(c => (a.cpf && c.cpf && c.cpf.replace(/\D/g, '') === a.cpf.replace(/\D/g, '')) || (a.telefone && c.telefone && c.telefone.replace(/\D/g, '').slice(-8) === a.telefone.replace(/\D/g, '').slice(-8))) : null;
  UI.modal({ title: 'Ficha de Anamnese', size: 'lg', body: `
    <div class="row mb"><div><div style="font-size:20px;font-weight:700">${esc(a.nome)}</div><div class="muted small">Recebida em ${fdt(a.criadoEm)} · ${a.tipoProcedimento === 'piercing' ? 'Piercing' : 'Tatuagem'} ${a.regiao ? '— ' + esc(a.regiao) : ''}</div></div><span class="grow"></span>${UI.statusPill(a.status)}</div>
    ${menor ? `<div class="alert bad mb">${ic('alert')}<div><b>Menor de idade (${idade(a.nasc)} anos).</b> Exige autorização e presença do responsável legal. Responsável: ${esc(a.responsavel || 'não informado')} ${a.responsavelCpf ? '— CPF ' + esc(a.responsavelCpf) : ''}</div></div>` : ''}
    ${al.length ? `<div class="alert warn mb">${ic('alert')}<div><b>Pontos de atenção:</b> ${al.map(esc).join(' · ')}</div></div>` : '<div class="alert ok mb">Nenhuma resposta de risco.</div>'}
    <div class="grid g3 small">

      <div><span class="muted">E-mail:</span> ${esc(a.email || '—')}</div><div><span class="muted">Endereço:</span> ${esc(a.endereco || '—')}</div><div><span class="muted">Contato de emergência:</span> ${esc(a.contatoEmergencia || '—')}</div>

    </div><div>${a.assinatura ? `<div class="small muted mb">Assinatura</div><img class="sig-img" src="${a.assinatura}">` : '<div class="muted small">Sem assinatura digital</div>'}</div></div>

    foot: `<button class="btn" onclick="window.print()">${ic('print')} Imprimir / PDF</button>${a.telefone ? `<a class="btn" target="_blank" href="${UI.wa(a.telefone, '')}">${ic('wa')}</a>` : ''}<span class="grow"></span>

    onOpen: m => {
      const link = cid => { a.clienteId = cid; DB.save('anamneses', a); UI.toast('Ficha vinculada ao cliente'); m.close(); Forms.verAnamnese(a.id); };
      if (m.$('#aLinkM')) m.$('#aLinkM').onclick = () => link(match.id);
      if (m.$('#aSel')) m.$('#aSel').onchange = e => e.target.value && link(e.target.value);
      if (m.$('#aNew')) m.$('#aNew').onclick = () => { const c = DB.save('clientes', { nome: a.nome, cpf: a.cpf, nasc: a.nasc, telefone: a.telefone, email: a.email, endereco: a.endereco, instagram: a.instagram || '', origem: 'Ficha online' }); link(c.id); };
      if (m.$('#aRev')) m.$('#aRev').onclick = () => { a.status = 'revisada'; a.revisadaPor = DB.user.nome; a.revisadaEm = new Date().toISOString(); DB.save('anamneses', a); m.close(); UI.toast('Ficha revisada'); };
      if (m.$('#aArq')) m.$('#aArq').onclick = () => { a.status = 'arquivada'; DB.save('anamneses', a); m.close(); };

};

/* ---------------- EQUIPE & COMISSÕES ---------------- */
Views.equipe = {
  title: 'Equipe & Comissões', st: { ym: ymNow(), tab: 'comissoes' },
  sub() { return 'Tatuadores, piercers, recepção e limpeza — salários, comissões e pagamentos'; },
  render(el) {
    const st = this.st;
    App.actions(`<button class="btn pri" id="eqNovo">${ic('plus')} Novo membro</button>`);
    const profs = DB.all('profissionais').sort((a, b) => a.nome.localeCompare(b.nome));
    const ats = DB.all('atendimentos').filter(a => a.data.startsWith(st.ym));
    const com = DB.all('lancamentos').filter(l => l.categoria === 'Comissões');
    el.innerHTML = `<div class="toolbar"><div class="tabs"><button data-t="comissoes" class="${st.tab === 'comissoes' ? 'on' : ''}">Comissões do mês</button><button data-t="equipe" class="${st.tab === 'equipe' ? 'on' : ''}">Cadastro da equipe</button></div>
      ${st.tab === 'comissoes' ? `<span class="grow"></span><button class="btn icon" id="mP">${ic('left')}</button><b style="min-width:130px;text-align:center">${ymLabel(st.ym)}</b><button class="btn icon" id="mN">${ic('right')}</button><button class="btn" id="folha">${ic('money')} Lançar folha do mês</button>` : ''}</div><div id="body"></div>`;
    const body = $('#body', el);
    if (st.tab === 'equipe') {
      body.innerHTML = UI.table([
        { t: 'Nome', v: p => `<div class="row" style="flex-wrap:nowrap"><div class="avatar" style="background:${p.cor}">${initials(p.nome)}</div><div><span class="strong">${esc(p.nome)}</span><small>${esc(p.especialidade || '')}</small></div></div>` },
        { t: 'Função', v: p => esc(p.funcao) }, { t: 'Vínculo', v: p => `<span class="pill">${esc(p.vinculo)}</span>` },
        { t: 'Salário fixo', cls: 'num', v: p => p.salario ? brl(p.salario) : '—' }, { t: 'Comissão', cls: 'num', v: p => p.comissaoPct ? p.comissaoPct + '%' : '—' },
        { t: 'Telefone', v: p => esc(p.telefone || '') }, { t: 'Status', v: p => p.ativo !== false ? '<span class="pill ok">Ativo</span>' : '<span class="pill">Inativo</span>' },
        { t: '', cls: 'act', v: p => `<button class="btn sm icon" data-e="${p.id}">${ic('edit')}</button>` }
      ], profs);
      $$('[data-e]', el).forEach(b => b.onclick = () => this.form(DB.get('profissionais', b.dataset.e)));
    } else {
      const rows = profs.filter(p => p.comissaoPct > 0 || ats.some(a => a.profissionalId === p.id)).map(p => {
        const a = ats.filter(x => x.profissionalId === p.id), c = com.filter(l => l.profissionalId === p.id && l.data.startsWith(st.ym));
        return { p, n: a.length, fat: sum(a, x => x.valorLiquido), tot: sum(c, l => l.valor), pago: sum(c.filter(l => l.status === 'pago'), l => l.valor), pend: sum(c.filter(l => l.status === 'pendente'), l => l.valor), ids: c.filter(l => l.status === 'pendente').map(l => l.id) };
      });
      const fixos = profs.filter(p => p.salario > 0 && p.ativo !== false);
      body.innerHTML = `<div class="grid g4 mb">
        <div class="card kpi"><div class="lbl">Comissões geradas</div><div class="val">${brl(sum(rows, r => r.tot))}</div></div>
        <div class="card kpi green"><div class="lbl">Já pagas</div><div class="val">${brl(sum(rows, r => r.pago))}</div></div>
        <div class="card kpi gold"><div class="lbl">A pagar</div><div class="val">${brl(sum(rows, r => r.pend))}</div><div class="hint">vencimento dia ${DB.config.diaComissao} do mês seguinte</div></div>
        <div class="card kpi blue"><div class="lbl">Folha fixa (salários/diaristas)</div><div class="val">${brl(sum(fixos, p => p.salario))}</div><div class="hint">${fixos.length} pessoas</div></div></div>
        ${UI.table([
          { t: 'Profissional', v: r => `<span style="color:${r.p.cor}">●</span> <b>${esc(r.p.nome)}</b><small>${esc(r.p.funcao)} · ${r.p.comissaoPct}%</small>` },
          { t: 'Atendimentos', cls: 'num', v: r => r.n }, { t: 'Faturamento', cls: 'num', v: r => brl(r.fat) },
          { t: 'Comissão total', cls: 'num', v: r => `<b>${brl(r.tot)}</b>` }, { t: 'Pago', cls: 'num', v: r => brl(r.pago) }, { t: 'Pendente', cls: 'num', v: r => r.pend ? `<b class="down">${brl(r.pend)}</b>` : '—' },
          { t: '', cls: 'act', v: r => `<button class="btn sm" data-ext="${r.p.id}">${ic('eye')} Extrato</button>${r.pend ? `<button class="btn sm ok" data-pay="${r.p.id}">${ic('check')} Pagar ${brl(r.pend)}</button>` : ''}` }
        ], rows, { emptyMsg: 'Sem comissões no período', foot: `<tr><td>Total</td><td class="num">${sum(rows, r => r.n)}</td><td class="num">${brl(sum(rows, r => r.fat))}</td><td class="num">${brl(sum(rows, r => r.tot))}</td><td class="num">${brl(sum(rows, r => r.pago))}</td><td class="num">${brl(sum(rows, r => r.pend))}</td><td></td></tr>` })}`;
      $$('[data-pay]', el).forEach(b => b.onclick = () => { const r = rows.find(x => x.p.id === b.dataset.pay); UI.confirm(`Confirmar pagamento de <b>${brl(r.pend)}</b> em comissões para <b>${esc(r.p.nome)}</b> (${ymLabel(st.ym)})?`, () => { r.ids.forEach(id => { const l = DB.get('lancamentos', id); l.status = 'pago'; l.pagoEm = today(); DB.save('lancamentos', l, true); }); DB.emit(); UI.toast('Comissões pagas'); }, { yes: 'Pagar', danger: false }); });
      $$('[data-ext]', el).forEach(b => b.onclick = () => this.extrato(b.dataset.ext, st.ym));
      $('#mP').onclick = () => { st.ym = ymShift(st.ym, -1); this.render(el); };
      $('#mN').onclick = () => { st.ym = ymShift(st.ym, 1); this.render(el); };
      $('#folha').onclick = () => {
        let n = 0;
        const doMesL = DB.all('lancamentos').filter(l => l.tipo === 'despesa' && l.data.startsWith(st.ym));
        fixos.forEach(p => { if (doMesL.some(l => l.folhaRef === `${p.id}:${st.ym}` || l.profissionalId === p.id && ['Salários e encargos', 'Limpeza e conservação'].includes(l.categoria) || (['Salários e encargos', 'Limpeza e conservação'].includes(l.categoria) && l.descricao.includes(p.nome.split(' ')[0])))) return; DB.save('lancamentos', { tipo: 'despesa', categoria: /limpeza/i.test(p.funcao) ? 'Limpeza e conservação' : 'Salários e encargos', descricao: `${/limpeza/i.test(p.funcao) ? 'Limpeza' : 'Salário'} — ${p.nome} (${ymLabel(st.ym)})`, valor: p.salario, data: `${st.ym}-05`, vencimento: `${ymShift(st.ym, 1)}-05`, status: 'pendente', profissionalId: p.id, folhaRef: `${p.id}:${st.ym}` }, true); n++; });
        DB.emit(); UI.toast(n ? `${n} lançamento(s) de folha criados em Contas a pagar` : 'Folha deste mês já lançada', n ? 'ok' : 'warn');
      };
    }
    $$('[data-t]', el).forEach(b => b.onclick = () => { st.tab = b.dataset.t; this.render(el); });
    $('#eqNovo').onclick = () => this.form();
  },

  extrato(pid, ym) {
    const p = DB.get('profissionais', pid);
    const ats = DB.all('atendimentos').filter(a => a.profissionalId === pid && a.data.startsWith(ym)).sort((a, b) => a.data.localeCompare(b.data));
    UI.modal({ title: `Extrato de comissões — ${esc(p.nome)}`, size: 'lg', body: `<p class="muted mb">${ymLabel(ym)} · comissão padrão ${p.comissaoPct}%</p>${UI.table([
      { t: 'Data', v: a => fdate(a.data) }, { t: 'Cliente', v: a => esc(DB.get('clientes', a.clienteId)?.nome || '') }, { t: 'Serviço', v: a => esc(DB.get('servicos', a.servicoId)?.nome || '') },
      { t: 'Valor', cls: 'num', v: a => brl(a.valorLiquido) }, { t: '%', cls: 'num', v: a => a.comissaoPct + '%' }, { t: 'Comissão', cls: 'num', v: a => `<b>${brl(a.comissaoValor)}</b>` }
    ], ats, { foot: `<tr><td colspan="3">Total</td><td class="num">${brl(sum(ats, a => a.valorLiquido))}</td><td></td><td class="num">${brl(sum(ats, a => a.comissaoValor))}</td></tr>` })}`,
      foot: `<button class="btn" onclick="window.print()">${ic('print')} Imprimir</button><span class="grow"></span><button class="btn" data-close>Fechar</button>` });
  },

  form(p = {}) {
    const edit = !!p.id; p = { ativo: true, cor: '#7fae55', vinculo: 'Comissionado', funcao: 'Tatuador', comissaoPct: 50, salario: 0, ...p };
    UI.modal({ title: edit ? 'Editar membro da equipe' : 'Novo membro da equipe', body: `<form class="fg" id="pF">
      ${UI.f('Nome *', 'nome', p.nome, { col: 8 })}${UI.f('Cor na agenda', 'cor', p.cor, { type: 'color', col: 4, attrs: 'style="height:40px;padding:4px"' })}
      ${UI.f('Função', 'funcao', p.funcao, { type: 'select', col: 4, opts: ['Tatuador', 'Tatuadora', 'Body Piercer', 'Tatuador(a) e Piercer', 'Recepção', 'Limpeza', 'Gerente', 'Aprendiz', 'Outro'] })}
      ${UI.f('Vínculo', 'vinculo', p.vinculo, { type: 'select', col: 4, opts: ['Comissionado', 'CLT', 'CLT + comissão', 'Fixo (diarista)', 'MEI / PJ', 'Sócio'] })}
      ${UI.f('Especialidade', 'especialidade', p.especialidade, { col: 4, ph: 'Ex.: realismo' })}
      ${UI.f('Comissão (%)', 'comissaoPct', p.comissaoPct, { type: 'number', col: 4, help: '% sobre o valor líquido do serviço' })}
      ${UI.f('Salário / valor fixo mensal (R$)', 'salario', p.salario, { type: 'number', col: 4, help: 'incluir encargos para custo real' })}
      ${UI.f('Telefone', 'telefone', p.telefone, { col: 4 })}
      ${UI.f('Chave PIX', 'pix', p.pix, { col: 8 })}${UI.f('Status', 'ativo', p.ativo ? '1' : '0', { type: 'select', col: 4, opts: [['1', 'Ativo'], ['0', 'Inativo']] })}</form>`,
      foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="pOk">Salvar</button>`,
      onOpen: m => m.$('#pOk').onclick = () => { const d = UI.formData(m.$('#pF')); if (!d.nome) return UI.toast('Informe o nome', 'warn'); d.ativo = d.ativo === '1'; d.comissaoPct = +d.comissaoPct || 0; d.salario = +d.salario || 0; DB.save('profissionais', { ...p, ...d }); m.close(); UI.toast('Salvo'); } });
  }
};

/* ---------------- SERVIÇOS & KITS ---------------- */
Views.servicos = {
  title: 'Serviços & Kits de Insumos', st: { tipo: '' },
  sub() { return 'Defina o que cada procedimento consome — o custo e o lucro são calculados automaticamente'; },
  render(el) {
    const st = this.st;
    App.actions(`<button class="btn pri" id="sNovo">${ic('plus')} Novo serviço</button>`);
    const comTipo = t => { const ps = DB.all('profissionais').filter(p => p.ativo !== false && p.comissaoPct > 0 && (t === 'piercing' ? /pierc/i.test(p.funcao) : /tatu/i.test(p.funcao))); return ps.length ? sum(ps, p => p.comissaoPct) / ps.length : 0; };
    const rows = DB.all('servicos').filter(s => !st.tipo || s.tipo === st.tipo).map(s => { const k = Biz.custoKit(s.kit), c = comTipo(s.tipo), cv = s.precoBase * c / 100, l = s.precoBase - k - cv; return { ...s, _k: k, _c: c, _l: l }; }).sort((a, b) => a.tipo.localeCompare(b.tipo) || a.precoBase - b.precoBase);
    el.innerHTML = `<div class="toolbar"><div class="tabs">${[['', 'Todos'], ['tattoo', 'Tatuagem'], ['piercing', 'Piercing']].map(([k, t]) => `<button data-t="${k}" class="${st.tipo === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
      ${UI.table([
        { t: 'Serviço', v: s => `<span class="strong">${esc(s.nome)}</span><small>${s.tipo === 'piercing' ? 'Piercing' : 'Tatuagem'} · ${s.duracaoMin} min · ${(s.kit || []).length} itens no kit</small>` },
        { t: 'Preço base', cls: 'num', v: s => brl(s.precoBase) },
        { t: 'Custo do kit', cls: 'num', v: s => `${brl(s._k)}<small>${pct(s.precoBase ? s._k / s.precoBase * 100 : 0)} do preço</small>` },
        { t: 'Comissão média', cls: 'num', v: s => `${brl(s.precoBase * s._c / 100)}<small>${pct(s._c)}</small>` },
        { t: 'Lucro estimado', cls: 'num', v: s => `<b class="${s._l < 0 ? 'down' : 'up'}">${brl(s._l)}</b><small>margem ${pct(s.precoBase ? s._l / s.precoBase * 100 : 0)}</small>` },
        { t: 'Status', v: s => s.ativo !== false ? '<span class="pill ok">Ativo</span>' : '<span class="pill">Inativo</span>' },
        { t: '', cls: 'act', v: s => `<button class="btn sm icon" data-e="${s.id}">${ic('edit')}</button>` }
      ], rows)}
      <div class="alert info mt">${ic('alert')}<div>Lucro estimado = preço base − custo do kit de insumos − comissão média dos profissionais do tipo. Não considera taxas de cartão nem despesas fixas (veja a DRE para o resultado completo).</div></div>`;
    $$('[data-t]', el).forEach(b => b.onclick = () => { st.tipo = b.dataset.t; this.render(el); });
    $$('[data-e]', el).forEach(b => b.onclick = () => this.form(DB.get('servicos', b.dataset.e)));
    $('#sNovo').onclick = () => this.form();
  },

  form(s = {}) {
    const edit = !!s.id; s = { tipo: 'tattoo', duracaoMin: 60, ativo: true, kit: [], ...s };
    const opts = UI.opts('insumos', { empty: '— insumo —', label: i => `${i.nome} (${i.unidade} · ${brl(i.custoUnit)})` });
    const row = (k = {}) => `<tr><td><select data-k="insumoId">${opts.map(([v, t]) => `<option value="${v}" ${v === k.insumoId ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td><td style="width:110px"><input type="number" step="any" data-k="qtd" value="${k.qtd ?? 1}"></td><td class="num" data-c style="width:100px"></td><td style="width:40px"><button type="button" class="btn sm icon danger" data-rm>${ic('x')}</button></td></tr>`;
    UI.modal({ title: edit ? 'Editar serviço' : 'Novo serviço', size: 'lg', body: `<form class="fg" id="sF">
      ${UI.f('Nome *', 'nome', s.nome, { col: 6 })}${UI.f('Tipo', 'tipo', s.tipo, { type: 'select', col: 2, opts: [['tattoo', 'Tatuagem'], ['piercing', 'Piercing'], ['outro', 'Outro']] })}
      ${UI.f('Preço base (R$)', 'precoBase', s.precoBase, { type: 'number', col: 2 })}${UI.f('Duração (min)', 'duracaoMin', s.duracaoMin, { type: 'number', col: 2 })}
      <div class="fsec">Kit de insumos consumidos por procedimento</div>
      <div class="c12"><div class="tbl-wrap"><table class="tbl" id="kT"><thead><tr><th>Insumo</th><th>Qtd</th><th class="num">Custo</th><th></th></tr></thead><tbody>${s.kit.map(row).join('')}</tbody></table></div><button type="button" class="btn sm mt" id="kAdd">${ic('plus')} Adicionar insumo</button></div>
      ${UI.f('Status', 'ativo', s.ativo !== false ? '1' : '0', { type: 'select', col: 3, opts: [['1', 'Ativo'], ['0', 'Inativo']] })}
      <div class="c9 calc-box" id="kC"></div></form>`,
      foot: `${edit ? `<button class="btn danger" id="sDel">${ic('trash')}</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn pri" id="sOk">Salvar</button>`,
      onOpen: m => {
        const read = () => $$('#kT tbody tr', m.el).map(tr => ({ insumoId: $('[data-k=insumoId]', tr).value, qtd: +$('[data-k=qtd]', tr).value || 0 })).filter(k => k.insumoId);
        const calc = () => { $$('#kT tbody tr', m.el).forEach(tr => { const i = DB.get('insumos', $('[data-k=insumoId]', tr).value); $('[data-c]', tr).textContent = i ? brl(i.custoUnit * (+$('[data-k=qtd]', tr).value || 0)) : '—'; }); const k = Biz.custoKit(read()), p = +m.$('[name=precoBase]').value || 0; m.$('#kC').innerHTML = `<div><small>Custo do kit</small><b>${brl(k)}</b></div><div><small>% do preço</small><b>${pct(p ? k / p * 100 : 0)}</b></div><div><small>Sobra antes da comissão</small><b class="up">${brl(p - k)}</b></div>`; };
        const bind = () => $$('[data-rm]', m.el).forEach(b => b.onclick = () => { b.closest('tr').remove(); calc(); });
        m.el.addEventListener('input', calc); m.el.addEventListener('change', calc);
        m.$('#kAdd').onclick = () => { $('#kT tbody', m.el).insertAdjacentHTML('beforeend', row()); bind(); calc(); };
        bind(); calc();
        m.$('#sOk').onclick = () => { const d = UI.formData(m.$('#sF')); if (!d.nome) return UI.toast('Informe o nome', 'warn'); DB.save('servicos', { ...s, nome: d.nome, tipo: d.tipo, precoBase: +d.precoBase || 0, duracaoMin: +d.duracaoMin || 60, ativo: d.ativo === '1', kit: read() }); m.close(); UI.toast('Serviço salvo'); };
        if (edit) m.$('#sDel').onclick = () => UI.confirm('Excluir este serviço? (atendimentos antigos são mantidos)', () => { DB.remove('servicos', s.id); m.close(); });
      }
    });
  }
};

  <script>

/* ---------------- INSUMOS ---------------- */
Views.insumos = {
  title: 'Estoque de Insumos', st: { cat: '', q: '', f: '' },
  sub() { return 'Da agulha ao desinfetante — tudo que o estúdio consome'; },
  render(el, params) {
    const st = this.st; if (params.f) { st.f = params.f; delete params.f; }
    const all = DB.all('insumos');
    const lim = new Date(); lim.setDate(lim.getDate() + 60); const limS = isoLocal(lim);
    App.actions(`<button class="btn" id="iCompras">${ic('cart')} Lista de compras</button><button class="btn" id="iConsumo">${ic('coffee')} Baixa de consumo interno</button><button class="btn pri" id="iNovo">${ic('plus')} Novo insumo</button>`);
    el.innerHTML = `<div class="grid g4 mb">
      <div class="card kpi"><div class="ic">${ic('box')}</div><div class="lbl">Itens cadastrados</div><div class="val">${all.length}</div></div>
      <div class="card kpi gold"><div class="ic">${ic('money')}</div><div class="lbl">Valor em estoque</div><div class="val">${brl(sum(all, i => i.qtd * i.custoUnit))}</div></div>
      <div class="card kpi"><div class="ic">${ic('alert')}</div><div class="lbl">Abaixo do mínimo</div><div class="val down">${all.filter(i => i.qtd <= i.minimo).length}</div></div>
      <div class="card kpi blue"><div class="ic">${ic('clock')}</div><div class="lbl">Vencendo em 60 dias</div><div class="val">${all.filter(i => i.validade && i.validade <= limS).length}</div></div></div>
      <div class="toolbar"><div class="search">${ic('search')}<input id="q" placeholder="Buscar insumo, fornecedor, lote..." value="${esc(st.q)}"></div>
      <select id="cat" style="width:auto"><option value="">Todas as categorias</option>${CAT_INSUMO.map(c => `<option ${st.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <div class="tabs"><button data-f="" class="${!st.f ? 'on' : ''}">Todos</button><button data-f="baixo" class="${st.f === 'baixo' ? 'on' : ''}">Estoque baixo</button><button data-f="venc" class="${st.f === 'venc' ? 'on' : ''}">Vencendo</button></div></div><div id="lst"></div>`;
    const draw = () => {
      const q = st.q.toLowerCase();
      const rows = all.filter(i => (!st.cat || i.categoria === st.cat) && (!q || [i.nome, i.fornecedor, i.lote].join(' ').toLowerCase().includes(q)) && (st.f !== 'baixo' || i.qtd <= i.minimo) && (st.f !== 'venc' || (i.validade && i.validade <= limS)))
        .sort((a, b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome));
      $('#lst', el).innerHTML = UI.table([
        { t: 'Insumo', v: i => `<span class="strong">${esc(i.nome)}</span><small>${esc(i.categoria)}${i.fornecedor ? ' · ' + esc(i.fornecedor) : ''}</small>` },
        { t: 'Estoque', v: i => { const p = Math.min(100, i.minimo ? i.qtd / (i.minimo * 2) * 100 : 100); const c = i.qtd <= i.minimo ? 'var(--bad)' : i.qtd <= i.minimo * 1.5 ? 'var(--warn)' : 'var(--ok)'; return `<b style="color:${c}">${num(i.qtd)} ${esc(i.unidade)}</b><div class="bar" style="width:120px;margin-top:4px"><i style="width:${p}%;background:${c}"></i></div><small>mín. ${num(i.minimo)}</small>`; } },
        { t: 'Custo un.', cls: 'num', v: i => brl(i.custoUnit) + `<small>/${esc(i.unidade)}</small>` },
        { t: 'Valor total', cls: 'num', v: i => brl(i.qtd * i.custoUnit) },
        { t: 'Validade', v: i => i.validade ? `<span class="${i.validade < today() ? 'down' : i.validade <= limS ? '' : ''}">${fdate(i.validade)}</span>${i.validade <= limS ? `<small class="${i.validade < today() ? 'down' : ''}">${i.validade < today() ? 'VENCIDO' : 'vence em breve'}</small>` : ''}<small>${esc(i.lote || '')}</small>` : '—' },
        { t: '', cls: 'act', v: i => `<button class="btn sm ok" data-in="${i.id}" title="Entrada / compra">${ic('in')}</button><button class="btn sm" data-out="${i.id}" title="Saída / consumo">${ic('out')}</button><button class="btn sm icon" data-e="${i.id}">${ic('edit')}</button>` }
      ], rows, { emptyMsg: 'Nenhum insumo encontrado' });
      $$('[data-in]', el).forEach(b => b.onclick = () => Forms.movimento('insumo', b.dataset.in, 'entrada'));
      $$('[data-out]', el).forEach(b => b.onclick = () => Forms.movimento('insumo', b.dataset.out, 'saida'));
      $$('[data-e]', el).forEach(b => b.onclick = () => this.form(DB.get('insumos', b.dataset.e)));
    };
    draw();
    $('#q').oninput = e => { st.q = e.target.value; draw(); };
    $('#cat').onchange = e => { st.cat = e.target.value; draw(); };
    $$('[data-f]', el).forEach(b => b.onclick = () => { st.f = b.dataset.f; this.render(el, {}); });
    $('#iNovo').onclick = () => this.form();
    $('#iConsumo').onclick = () => this.consumo();
    $('#iCompras').onclick = () => Forms.listaCompras();
  },

  form(i = {}) {
    const edit = !!i.id; i = { categoria: 'Descartáveis', unidade: 'un', qtd: 0, minimo: 0, custoUnit: 0, ...i };
    UI.modal({ title: edit ? 'Editar insumo' : 'Novo insumo', body: `<form class="fg" id="iF">
      ${UI.f('Nome *', 'nome', i.nome, { col: 8, ph: 'Ex.: Cartucho 3RL 0,35mm' })}${UI.f('Categoria', 'categoria', i.categoria, { type: 'select', col: 4, opts: CAT_INSUMO })}
      ${UI.f('Unidade de controle', 'unidade', i.unidade, { type: 'select', col: 3, opts: ['un', 'par', 'ml', 'l', 'g', 'kg', 'm', 'cm', 'folha', 'caixa', 'rolo', 'pacote'] })}
      ${UI.f(edit ? 'Quantidade atual' : 'Quantidade inicial', 'qtd', i.qtd, { type: 'number', col: 3, attrs: edit ? 'readonly title="Use entrada/saída/ajuste"' : '' })}
      ${UI.f('Estoque mínimo', 'minimo', i.minimo, { type: 'number', col: 3 })}${UI.f('Custo por unidade (R$)', 'custoUnit', i.custoUnit, { type: 'number', col: 3 })}
      <div class="c12 calc-box"><div style="flex:1;min-width:260px"><small>Calculadora de custo unitário</small><div class="row mt"><input type="number" step="any" id="cPack" placeholder="Preço da embalagem R$" style="width:170px"><span>÷</span><input type="number" step="any" id="cQtd" placeholder="Qtd na embalagem" style="width:150px"><button type="button" class="btn sm" id="cApl">Aplicar</button></div><span class="help">Ex.: caixa de 100 luvas por R$ 38 → R$ 0,38 por unidade. Frasco de 240ml por R$ 187 → R$ 0,78/ml</span></div></div>
      ${UI.f('Fornecedor', 'fornecedor', i.fornecedor, { col: 4 })}${UI.f('Lote', 'lote', i.lote, { col: 4 })}${UI.f('Validade', 'validade', i.validade, { type: 'date', col: 4 })}
      ${UI.f('Observações', 'obs', i.obs, { type: 'textarea', col: 12 })}</form>`,
      foot: `${edit ? `<button class="btn danger" id="iDel">${ic('trash')}</button><button class="btn" id="iAj">Ajustar inventário</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn pri" id="iOk">Salvar</button>`,
      onOpen: m => {
        m.$('#cApl').onclick = () => { const p = +m.$('#cPack').value, q = +m.$('#cQtd').value; if (p && q) m.$('[name=custoUnit]').value = Math.round(p / q * 10000) / 10000; };
        m.$('#iOk').onclick = () => { const d = UI.formData(m.$('#iF')); if (!d.nome) return UI.toast('Informe o nome', 'warn'); ['qtd', 'minimo', 'custoUnit'].forEach(k => d[k] = +d[k] || 0); const r = DB.save('insumos', { ...i, ...d }); if (!edit && d.qtd) DB.save('movEstoque', { tipo: 'insumo', itemId: r.id, nome: r.nome, mov: 'entrada', qtd: d.qtd, saldo: d.qtd, custoUnit: d.custoUnit, motivo: 'Estoque inicial', data: today() }); m.close(); UI.toast('Insumo salvo'); };
        if (edit) { m.$('#iDel').onclick = () => UI.confirm('Excluir este insumo?', () => { DB.remove('insumos', i.id); m.close(); }); m.$('#iAj').onclick = () => { m.close(); Forms.movimento('insumo', i.id, 'ajuste'); }; }
      }
    });
  },

  consumo() {
    const itens = DB.all('insumos').filter(i => ['Copa/Café', 'Higienização/Limpeza', 'Descartáveis', 'Escritório'].includes(i.categoria)).sort((a, b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome));
    UI.modal({ title: 'Baixa de consumo interno', size: 'lg', body: `<p class="muted mb">Registre o que foi gasto no dia a dia do estúdio fora dos atendimentos: café, açúcar, copos, água, produtos de limpeza do salão, papel... O custo entra na DRE como despesa operacional.</p>
      <div class="row mb"><div class="f" style="width:180px"><label>Data</label><input type="date" id="cData" value="${today()}"></div><div class="f grow"><label>Observação</label><input id="cObs" placeholder="Ex.: consumo da semana"></div></div>
      ${UI.table([{ t: 'Item', v: i => `<span class="strong">${esc(i.nome)}</span><small>${esc(i.categoria)}</small>` }, { t: 'Em estoque', cls: 'num', v: i => `${num(i.qtd)} ${esc(i.unidade)}` }, { t: 'Custo un.', cls: 'num', v: i => brl(i.custoUnit) }, { t: 'Qtd consumida', v: i => `<input type="number" step="any" data-c="${i.id}" style="width:120px" placeholder="0">` }, { t: 'Custo', cls: 'num', v: i => `<span data-v="${i.id}">—</span>` }], itens)}
      <div class="calc-box mt"><div><small>Total do consumo</small><b id="cTot">${brl(0)}</b></div></div>`,
      foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="cOk">Registrar baixa</button>`,
      onOpen: m => {
        const calc = () => { let t = 0; $$('[data-c]', m.el).forEach(inp => { const i = DB.get('insumos', inp.dataset.c), v = (+inp.value || 0) * i.custoUnit; t += v; $(`[data-v="${i.id}"]`, m.el).textContent = inp.value ? brl(v) : '—'; }); m.$('#cTot').textContent = brl(t); };
        m.el.addEventListener('input', calc);
        m.$('#cOk').onclick = () => { let n = 0; const d = m.$('#cData').value || today(); $$('[data-c]', m.el).forEach(inp => { if (+inp.value > 0) { Biz.mover({ tipo: 'insumo', itemId: inp.dataset.c, mov: 'saida', qtd: +inp.value, motivo: 'Consumo interno', ref: m.$('#cObs').value, data: d }); n++; } }); if (!n) return UI.toast('Informe ao menos uma quantidade', 'warn'); DB.emit(); m.close(); UI.toast(`${n} itens baixados do estoque`); };
      }
    });
  }
};

Forms.listaCompras = () => {
  const ins = DB.all('insumos').filter(i => i.qtd <= i.minimo).map(i => ({ n: i.nome, cat: i.categoria, f: i.fornecedor, q: Math.ceil(i.minimo * 2 - i.qtd), u: i.unidade, c: i.custoUnit }));
  const jo = DB.all('joias').filter(j => j.qtd <= j.minimo).map(j => ({ n: `${j.nome} ${j.bitola || ''} ${j.tamanho || ''}`, cat: 'Joias', f: j.fornecedor, q: Math.ceil(j.minimo * 2 - j.qtd), u: 'un', c: j.custo }));
  const all = [...ins, ...jo]; const tot = sum(all, x => x.q * x.c);
  const txt = `*Lista de compras — ${DB.config.nome}* (${fdate(today())})\n\n` + all.map(x => `• ${x.n}: ${num(x.q)} ${x.u}${x.f ? ` (${x.f})` : ''}`).join('\n') + `\n\nEstimativa: ${brl(tot)}`;
  UI.modal({ title: 'Lista de compras sugerida', size: 'lg', body: `<p class="muted mb">Itens abaixo do estoque mínimo. Quantidade sugerida = repor até 2× o mínimo.</p>
    ${UI.table([{ t: 'Item', v: x => `<span class="strong">${esc(x.n)}</span><small>${esc(x.cat)}</small>` }, { t: 'Fornecedor', v: x => esc(x.f || '—') }, { t: 'Comprar', cls: 'num', v: x => `<b>${num(x.q)} ${esc(x.u)}</b>` }, { t: 'Custo estimado', cls: 'num', v: x => brl(x.q * x.c) }], all, { emptyMsg: 'Nada para comprar — estoque em dia!', foot: all.length ? `<tr><td colspan="3">Total estimado</td><td class="num">${brl(tot)}</td></tr>` : '' })}`,
    foot: `<button class="btn" onclick="window.print()">${ic('print')} Imprimir</button><button class="btn" id="lcCp">${ic('copy')} Copiar</button><a class="btn ok" target="_blank" href="https://wa.me/?text=${encodeURIComponent(txt)}">${ic('wa')} Enviar no WhatsApp</a>`,
    onOpen: m => m.$('#lcCp').onclick = () => UI.copy(txt) });
};

Forms.movimento = (tipo, id, mov) => {
  const col = tipo === 'joia' ? 'joias' : 'insumos'; const it = DB.get(col, id); if (!it) return;
  const cu = tipo === 'joia' ? it.custo : it.custoUnit, un = tipo === 'joia' ? 'un' : it.unidade;
  const tit = { entrada: 'Entrada no estoque (compra)', saida: 'Saída do estoque', ajuste: 'Ajuste de inventário (contagem)' }[mov];
  UI.modal({ title: tit, size: 'sm', body: `<div class="mb"><b>${esc(it.nome)}</b><div class="muted small">Estoque atual: ${num(it.qtd)} ${esc(un)} · custo ${brl(cu)}/${esc(un)}</div></div><form class="fg" id="mF">
    ${UI.f(mov === 'ajuste' ? 'Quantidade contada' : 'Quantidade (' + un + ')', 'qtd', '', { type: 'number', col: 6 })}${UI.f('Data', 'data', today(), { type: 'date', col: 6 })}
    ${mov === 'entrada' ? `${UI.f('Custo por ' + un + ' (R$)', 'custoUnit', cu, { type: 'number', col: 6, help: 'atualiza o custo médio' })}${UI.f('Valor total da nota', 'total', '', { type: 'number', col: 6 })}
      <div class="c12"><label class="row small"><input type="checkbox" name="gerarDesp" checked> Lançar despesa no financeiro (${tipo === 'joia' ? 'Compra de joias' : 'Compra de insumos'})</label></div>
      ${UI.f('Status do pagamento', 'statusPg', 'pago', { type: 'select', col: 6, opts: [['pago', 'Pago'], ['pendente', 'A pagar']] })}${UI.f('Fornecedor / NF', 'ref', it.fornecedor || '', { col: 6 })}` : ''}
    ${mov === 'saida' ? UI.f('Motivo', 'motivo', 'Consumo interno', { type: 'select', col: 12, opts: MOTIVOS_SAIDA }) + UI.f('Observação', 'ref', '', { col: 12 }) : ''}
    ${mov === 'ajuste' ? UI.f('Motivo do ajuste', 'ref', 'Contagem de inventário', { col: 12 }) : ''}</form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="mOk">Confirmar</button>`,
    onOpen: m => {
      const F = m.$('#mF');
      if (mov === 'entrada') { const sync = () => { if (F.qtd.value && F.custoUnit.value) F.total.value = Math.round(F.qtd.value * F.custoUnit.value * 100) / 100; }; F.qtd.oninput = sync; F.custoUnit.oninput = sync; F.total.oninput = () => { if (F.qtd.value && F.total.value) F.custoUnit.value = Math.round(F.total.value / F.qtd.value * 10000) / 10000; }; }
      m.$('#mOk').onclick = () => {
        const d = UI.formData(F); if (d.qtd === '' || (mov !== 'ajuste' && !(d.qtd > 0))) return UI.toast('Informe a quantidade', 'warn');
        Biz.mover({ tipo, itemId: id, mov, qtd: d.qtd, custoUnit: mov === 'entrada' ? d.custoUnit : null, motivo: mov === 'entrada' ? 'Compra' : mov === 'ajuste' ? 'Ajuste de inventário' : d.motivo, ref: d.ref, data: d.data });
        if (mov === 'entrada' && d.gerarDesp) DB.save('lancamentos', { tipo: 'despesa', categoria: tipo === 'joia' ? 'Compra de joias (estoque)' : 'Compra de insumos', descricao: `Compra: ${d.qtd} ${un} ${it.nome}${d.ref ? ' — ' + d.ref : ''}`, valor: round2(d.total || d.qtd * d.custoUnit), data: d.data, vencimento: d.data, status: d.statusPg, pagoEm: d.statusPg === 'pago' ? d.data : null, forma: 'PIX' }, true);
        DB.emit(); m.close(); UI.toast('Estoque atualizado');
      };
    }
  });
};

/* ---------------- JOIAS ---------------- */
Views.joias = {
  title: 'Estoque de Joias', st: { cat: '', mat: '', q: '', f: '' },
  sub() { return 'Custo, markup, margem de lucro e preço de venda de cada peça'; },
  render(el, params) {
    const st = this.st; if (params.f) { st.f = params.f; delete params.f; }
    const all = DB.all('joias');
    const vC = sum(all, j => j.qtd * j.custo), vV = sum(all, j => j.qtd * j.preco);
    App.actions(`<button class="btn" id="jMk">${ic('trend')} Reajuste de markup</button><button class="btn pri" id="jNovo">${ic('plus')} Nova joia</button>`);
    el.innerHTML = `<div class="grid g4 mb">
      <div class="card kpi"><div class="ic">${ic('gem')}</div><div class="lbl">Peças em estoque</div><div class="val">${num(sum(all, j => j.qtd), 0)}</div><div class="hint">${all.length} modelos</div></div>
      <div class="card kpi gold"><div class="ic">${ic('money')}</div><div class="lbl">Valor de custo</div><div class="val">${brl(vC)}</div></div>
      <div class="card kpi green"><div class="ic">${ic('trend')}</div><div class="lbl">Valor de venda</div><div class="val">${brl(vV)}</div><div class="hint">lucro potencial ${brl(vV - vC)}</div></div>
      <div class="card kpi"><div class="ic">${ic('alert')}</div><div class="lbl">Estoque baixo</div><div class="val down">${all.filter(j => j.qtd <= j.minimo).length}</div></div></div>
      <div class="toolbar"><div class="search">${ic('search')}<input id="q" placeholder="Buscar joia, SKU..." value="${esc(st.q)}"></div>
      <select id="cat" style="width:auto"><option value="">Todos os tipos</option>${CAT_JOIA.map(c => `<option ${st.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <select id="mat" style="width:auto"><option value="">Todos os materiais</option>${MATERIAIS.map(c => `<option ${st.mat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <div class="tabs"><button data-f="" class="${!st.f ? 'on' : ''}">Todas</button><button data-f="baixo" class="${st.f === 'baixo' ? 'on' : ''}">Estoque baixo</button></div></div><div id="lst"></div>`;
    const draw = () => {
      const q = st.q.toLowerCase();
      const rows = all.filter(j => (!st.cat || j.categoria === st.cat) && (!st.mat || j.material === st.mat) && (st.f !== 'baixo' || j.qtd <= j.minimo) && (!q || [j.nome, j.sku, j.material].join(' ').toLowerCase().includes(q))).sort((a, b) => a.nome.localeCompare(b.nome));
      $('#lst', el).innerHTML = UI.table([
        { t: 'Joia', v: j => `<span class="strong">${esc(j.nome)}</span><small>${esc(j.sku || '')} · ${esc(j.categoria)}</small>` },
        { t: 'Material / medida', v: j => `${esc(j.material)}<small>${esc(j.bitola || '')} ${j.tamanho && j.tamanho !== '—' ? '× ' + esc(j.tamanho) : ''}</small>` },
        { t: 'Estoque', cls: 'num', v: j => `<b class="${j.qtd <= j.minimo ? 'down' : ''}">${num(j.qtd, 0)}</b><small>mín. ${j.minimo}</small>` },
        { t: 'Custo', cls: 'num', v: j => brl(j.custo) },
        { t: 'Markup', cls: 'num', v: j => pct(Biz.markup(j.preco, j.custo)) },
        { t: 'Preço venda', cls: 'num', v: j => `<b style="color:var(--gold)">${brl(j.preco)}</b>` },
        { t: 'Lucro / margem', cls: 'num', v: j => `<b class="up">${brl(j.preco - j.custo)}</b><small>${pct(Biz.margem(j.preco, j.custo))} sobre a venda</small>` },
        { t: '', cls: 'act', v: j => `<button class="btn sm ok" data-in="${j.id}" title="Entrada">${ic('in')}</button><button class="btn sm" data-out="${j.id}" title="Saída">${ic('out')}</button><button class="btn sm icon" data-e="${j.id}">${ic('edit')}</button>` }
      ], rows, { emptyMsg: 'Nenhuma joia encontrada' });
      $$('[data-in]', el).forEach(b => b.onclick = () => Forms.movimento('joia', b.dataset.in, 'entrada'));
      $$('[data-out]', el).forEach(b => b.onclick = () => Forms.movimento('joia', b.dataset.out, 'saida'));
      $$('[data-e]', el).forEach(b => b.onclick = () => this.form(DB.get('joias', b.dataset.e)));
    };
    draw();
    $('#q').oninput = e => { st.q = e.target.value; draw(); };
    $('#cat').onchange = e => { st.cat = e.target.value; draw(); };
    $('#mat').onchange = e => { st.mat = e.target.value; draw(); };
    $$('[data-f]', el).forEach(b => b.onclick = () => { st.f = b.dataset.f; this.render(el, {}); });
    $('#jNovo').onclick = () => this.form();
    $('#jMk').onclick = () => this.reajuste();
  },

  form(j = {}) {
    const edit = !!j.id; j = { categoria: 'Labret', material: 'Titânio ASTM F136', markup: 150, precoAuto: true, qtd: 0, minimo: 3, custo: 0, ...j };
    UI.modal({ title: edit ? 'Editar joia' : 'Nova joia', body: `<form class="fg" id="jF">
      ${UI.f('Nome *', 'nome', j.nome, { col: 8, ph: 'Ex.: Labret Titânio ponto de luz' })}${UI.f('SKU / código', 'sku', j.sku || 'JW-' + (DB.all('joias').length + 101), { col: 4 })}
      ${UI.f('Tipo', 'categoria', j.categoria, { type: 'select', col: 4, opts: CAT_JOIA })}${UI.f('Material', 'material', j.material, { type: 'select', col: 4, opts: MATERIAIS })}
      ${UI.f('Bitola (espessura)', 'bitola', j.bitola, { col: 2, ph: '1,2mm' })}${UI.f('Tamanho', 'tamanho', j.tamanho, { col: 2, ph: '8mm' })}
      <div class="fsec">Precificação</div>
      ${UI.f('Custo (R$) *', 'custo', j.custo, { type: 'number', col: 3 })}${UI.f('Markup (%)', 'markup', j.markup, { type: 'number', col: 3, help: 'quanto acima do custo' })}
      ${UI.f('Preço de venda (R$)', 'preco', j.preco ?? Biz.precoPorMarkup(j.custo, j.markup), { type: 'number', col: 3 })}
      <div class="f c3"><label>Cálculo do preço</label><select name="precoAuto"><option value="1" ${j.precoAuto !== false ? 'selected' : ''}>Automático (markup)</option><option value="0" ${j.precoAuto === false ? 'selected' : ''}>Manual</option></select></div>
      <div class="c12 calc-box" id="jC"></div>
      <div class="fsec">Estoque</div>
      ${UI.f(edit ? 'Quantidade atual' : 'Quantidade inicial', 'qtd', j.qtd, { type: 'number', col: 3, attrs: edit ? 'readonly' : '' })}${UI.f('Estoque mínimo', 'minimo', j.minimo, { type: 'number', col: 3 })}${UI.f('Fornecedor', 'fornecedor', j.fornecedor, { col: 6 })}</form>`,
      foot: `${edit ? `<button class="btn danger" id="jDel">${ic('trash')}</button><button class="btn" id="jAj">Ajustar inventário</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn pri" id="jOk">Salvar</button>`,
      onOpen: m => {
        const F = m.$('#jF');
        const calc = src => {
          const c = +F.custo.value || 0, auto = F.precoAuto.value === '1';
          if (src === 'preco') { F.precoAuto.value = '0'; F.markup.value = Math.round(Biz.markup(+F.preco.value, c) * 10) / 10; }
          else if (auto || src === 'markup') { F.preco.value = Biz.precoPorMarkup(c, +F.markup.value); if (src === 'markup') F.precoAuto.value = '1'; }
          const p = +F.preco.value || 0;
          m.$('#jC').innerHTML = `<div><small>Custo</small><b>${brl(c)}</b></div><div><small>Preço de venda</small><b style="color:var(--gold)">${brl(p)}</b></div><div><small>Lucro por peça</small><b class="up">${brl(p - c)}</b></div><div><small>Markup</small><b>${pct(Biz.markup(p, c))}</b></div><div><small>Margem de lucro (sobre venda)</small><b>${pct(Biz.margem(p, c))}</b></div><div><small>Lucro no estoque</small><b>${brl((p - c) * (+F.qtd.value || 0))}</b></div>`;
        };
        F.custo.oninput = () => calc('custo'); F.markup.oninput = () => calc('markup'); F.preco.oninput = () => calc('preco'); F.precoAuto.onchange = () => calc('custo'); F.qtd.oninput = () => calc();
        calc();
        m.$('#jOk').onclick = () => {
          const d = UI.formData(F); if (!d.nome) return UI.toast('Informe o nome', 'warn');
          d.precoAuto = d.precoAuto === '1'; ['custo', 'markup', 'preco', 'qtd', 'minimo'].forEach(k => d[k] = +d[k] || 0);
          const r = DB.save('joias', { ...j, ...d });
          if (!edit && d.qtd) DB.save('movEstoque', { tipo: 'joia', itemId: r.id, nome: r.nome, mov: 'entrada', qtd: d.qtd, saldo: d.qtd, custoUnit: d.custo, motivo: 'Estoque inicial', data: today() });
          m.close(); UI.toast('Joia salva');
        };
        if (edit) { m.$('#jDel').onclick = () => UI.confirm('Excluir esta joia?', () => { DB.remove('joias', j.id); m.close(); }); m.$('#jAj').onclick = () => { m.close(); Forms.movimento('joia', j.id, 'ajuste'); }; }
      }
    });
  },

  reajuste() {
    UI.modal({ title: 'Reajuste de markup em massa', size: 'sm', body: `<form class="fg" id="rF">
      ${UI.f('Aplicar a', 'alvo', '', { type: 'select', col: 12, opts: [['', 'Todas as joias'], ...MATERIAIS.map(m => ['mat:' + m, 'Material: ' + m]), ...CAT_JOIA.map(c => ['cat:' + c, 'Tipo: ' + c])] })}
      ${UI.f('Novo markup (%)', 'markup', 150, { type: 'number', col: 12 })}
      <div class="c12 small muted">Joias com preço manual também passarão a usar o cálculo automático.</div></form>`,
      foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="rOk">Aplicar</button>`,
      onOpen: m => m.$('#rOk').onclick = () => {
        const d = UI.formData(m.$('#rF')); let n = 0;
        DB.all('joias').forEach(j => { if (d.alvo.startsWith('mat:') && j.material !== d.alvo.slice(4)) return; if (d.alvo.startsWith('cat:') && j.categoria !== d.alvo.slice(4)) return; j.markup = +d.markup; j.precoAuto = true; j.preco = Biz.precoPorMarkup(j.custo, j.markup); DB.save('joias', j, true); n++; });
        DB.emit(); m.close(); UI.toast(`${n} joias reajustadas`);
      } });
  }
};
